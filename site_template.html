<!-- 数据注入点：build_site.py 会把 JSON 替换到下一行的占位符（不要手改下一行） -->
<script>window.APP_DATA = __APP_DATA__;</script>
<script>
/*
  ============================================================================
  前端逻辑地图（按执行顺序）
    utils        格式化、聚合、掌握度判定
    analysis     computeModel：在浏览器里按同一口径重算（导入新数据时用）
    mind map     首页思维导图绘制
    home         首页渲染
    student      学生端渲染
    teacher      教师端渲染
    drawer       知识点详情抽屉（例题/推导/习题/证据）
    import       JSON / CSV 机器接入
    route        页面切换
  可调节的参数：
    CONFIG.mastery.*                     掌握度阈值（来自 model.json）
    CONFIG.baseline_error_rate           预警基线
    CONFIG.warning_top_n                 预警取前几个
    STATE 初始值                          默认打开哪个页面/哪个学生/哪个班
  ============================================================================
*/
(function(){
  "use strict";
  const D = window.APP_DATA;          // 由 build_site.py 注入的完整数据包
  const KP = D.points;                // 9 个知识点
  const KPMAP = Object.fromEntries(KP.map(p => [p.id, p]));
  const CONFIG = D.config;            // 分析口径，来自 engine.py 的 CONFIG
  const BASE = CONFIG.baseline_error_rate;  // 30% 预警基线
  // 初始状态：可调节默认首页、默认学生、默认班级
  const STATE = {
    view: "home",                     // home | student | teacher
    student: (D.students[0] || {}).id || "",
    teacherClass: "ALL",              // ALL 或具体班级名
    dataset: "demo"
  };
  let STUDENTS = D.students.map(s => ({...s}));
  let RAW = D.responses.map(r => ({...r}));
  let M = null;

  /* ---------- utils：格式化 / 聚合 / 掌握度判定 ---------- */
  /* 可调节：masteryOf 的阈值来自 CONFIG.mastery，改 model.json 或 engine.py 生效 */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pct = (x, d = 1) => (Number.isFinite(x) ? (x * 100).toFixed(d) : "0.0") + "%";
  const num = (x, d = 1) => Number.isFinite(x) ? x.toFixed(d) : "0.0";
  const unique = arr => Array.from(new Set(arr));
  function masteryOf(err){
    if (err <= CONFIG.mastery.mastered_max_error) return "掌握";
    if (err <= CONFIG.mastery.partial_max_error) return "部分掌握";
    return "未掌握";
  }
  function agg(rows){
    let score = 0, full = 0;
    rows.forEach(r => { score += r.sc; full += r.f; });
    const rate = full ? score / full : 0;
    return {attempts: rows.length, score, full, rate, err: full ? 1 - rate : 0};
  }
  function masteryClass(m){
    return m === "掌握" ? "m-mastered" : (m === "部分掌握" ? "m-partial" : "m-weak");
  }
  function typeBadge(t, small){
    const cls = t === "记忆型" ? "memory" : "logic";
    return `<span class="badge ${cls}">${esc(t)}</span>`;
  }
  function tierClass(t){ return t === "重点" ? "tier-focus" : (t === "次重点" ? "tier-mid" : "tier-note"); }
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("on"), 2400);
  }
  function splitLines(text, max, maxLines){
    const chars = Array.from(String(text || ""));
    const lines = [];
    let cur = "";
    for (const ch of chars){
      if (Array.from(cur).length >= max && lines.length < maxLines - 1){
        lines.push(cur); cur = "";
      }
      cur += ch;
    }
    if (cur) lines.push(cur);
    if (lines.length > maxLines){
      const out = lines.slice(0, maxLines);
      out[maxLines - 1] = out[maxLines - 1].slice(0, Math.max(1, max - 1)) + "…";
      return out;
    }
    if (lines.length === maxLines && Array.from(lines[maxLines - 1]).length > max){
      lines[maxLines - 1] = Array.from(lines[maxLines - 1]).slice(0, max - 1).join("") + "…";
    }
    return lines;
  }

  /* ---------- analysis：浏览器内重算模型（导入新数据时走这里） ---------- */
  /* computeModel 输出与 engine.py 同口径：错误率、掌握度、班级对比、预警 */
  function computeModel(students, responses){
    const byS = new Map(students.map(s => [s.id, []]));
    responses.forEach(r => { if (byS.has(r.s)) byS.get(r.s).push(r); });
    const clsOf = Object.fromEntries(students.map(s => [s.id, s.class]));
    const classes = unique(students.map(s => s.class)).sort();

    let points = KP.map(kp => {
      const rows = responses.filter(r => r.i === kp.id);
      const st = agg(rows);
      const classRates = {};
      classes.forEach(c => {
        const cr = rows.filter(r => clsOf[r.s] === c);
        if (cr.length){
          const cs = agg(cr);
          classRates[c] = {attempts: cs.attempts, score: cs.score, full: cs.full, rate: cs.rate, err: cs.err};
        }
      });
      return {...kp, ...st, mastery: masteryOf(st.err), classRates};
    });
    const ranked = points.slice().sort((a, b) => b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
    const n = ranked.length;
    const top = Math.max(1, Math.round(n * CONFIG.tiers[0].ratio));
    let mid = Math.max(1, Math.round(n * CONFIG.tiers[1].ratio));
    if (top + mid >= n) mid = Math.max(0, n - top - 1);
    ranked.forEach((p, i) => {
      p.rank = i + 1;
      p.tier = i < top ? "重点" : (i < top + mid ? "次重点" : "注意点");
    });
    points = ranked;
    const byId = Object.fromEntries(points.map(p => [p.id, p]));

    const studentRows = students.map(stu => {
      const rows = byS.get(stu.id) || [];
      const pstats = KP.map(kp => {
        const sub = rows.filter(r => r.i === kp.id);
        if (!sub.length) return null;
        const a = agg(sub);
        return {...kp, ...a, mastery: masteryOf(a.err)};
      }).filter(Boolean);
      const total = agg(rows);
      const eligible = pstats.filter(p => p.err > 0.0001 && p.attempts >= 2);
      const pool = eligible.length ? eligible : pstats.filter(p => p.err > 0.0001);
      const weakAll = pool.slice().sort((a, b) => (b.full - b.score) - (a.full - a.score) || b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
      const warnAll = pool.slice().sort((a, b) => b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
      let weak = weakAll.filter(p => p.err >= BASE).slice(0, 3);
      if (weak.length < 3){
        weak = weak.slice();
        for (const p of weakAll){ if (!weak.includes(p)) weak.push(p); if (weak.length === 3) break; }
      }
      const strong = pstats.slice().sort((a, b) => a.err - b.err || b.attempts - a.attempts || a.id.localeCompare(b.id)).slice(0, 3);
      const counts = {掌握: 0, 部分掌握: 0, 未掌握: 0};
      pstats.forEach(p => counts[p.mastery]++);
      const warnings = warnAll.slice(0, 3).map((p, i) => ({
        rank: i + 1, point_id: p.id, point_name: p.name, error_rate: p.err, attempts: p.attempts,
        parent_id: p.parent_id, parent_name: p.parent_name, parent_external: p.parent_external,
        reason: p.parent_reason,
        student_text: `「${p.parent_name}」学习仍有欠缺`,
        action: `先补「${p.parent_name}」，再回练「${p.name}」`
      }));
      return {
        ...stu, attempts: rows.length, score: total.score, full: total.full,
        rate: total.rate, err: total.err, points: pstats, weak_points: weak,
        strong_points: strong, mastery_counts: counts, warnings,
        advice_summary: weak.length
          ? `优先补「${weak.slice(0, 3).map(p => p.name).join("」「")}」。先按上面的逐条建议改错，再用同型题各练 3—5 道。`
          : "当前作答覆盖的知识点较少，建议先完成一轮完整练习后再生成个性化建议。"
      };
    });

    const byClass = {};
    classes.forEach(c => {
      const rows = studentRows.filter(s => s.class === c);
      const rates = rows.filter(s => s.attempts > 0).map(s => s.rate);
      const avg = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : 0;
      const dist = [
        {label: "不及格", range: "0—59%", count: rates.filter(r => r < 0.6).length},
        {label: "及格", range: "60—69%", count: rates.filter(r => r >= 0.6 && r < 0.7).length},
        {label: "良好", range: "70—84%", count: rates.filter(r => r >= 0.7 && r < 0.85).length},
        {label: "优秀", range: "85—100%", count: rates.filter(r => r >= 0.85).length}
      ];
      byClass[c] = {
        id: c, student_count: rows.length, avg, pass: rates.length ? rates.filter(r => r >= 0.6).length / rates.length : 0,
        excellent: rates.length ? rates.filter(r => r >= 0.85).length / rates.length : 0,
        distribution: dist,
        warnings: warningsFor(points.map(p => ({...p, err: p.classRates[c] ? p.classRates[c].err : p.err, attempts: p.classRates[c] ? p.classRates[c].attempts : 0})), 3)
      };
    });

    const sortedStudents = studentRows.slice();
    classes.forEach(c => {
      const rows = sortedStudents.filter(s => s.class === c).sort((a, b) => b.rate - a.rate || a.id.localeCompare(b.id));
      rows.forEach((s, i) => { s.class_rank = i + 1; s.class_size = rows.length; });
    });

    const warnings = warningsFor(points, CONFIG.warning_top_n);
    const teaching = teachingAdvice(studentRows, points);
    const attention = attentionList(studentRows);
    return {points, byId, classes: byClass, students: studentRows, warnings, teaching, attention, allResponses: responses};
  }

  function warningsFor(points, n){
    return points.filter(p => p.attempts > 0).slice().sort((a, b) => b.err - a.err || a.id.localeCompare(b.id)).slice(0, n).map((p, i) => ({
      rank: i + 1, point_id: p.id, point_name: p.name, error_rate: p.err, error_rate_text: pct(p.err), attempts: p.attempts,
      parent_id: p.parent_id, parent_name: p.parent_name, parent_external: p.parent_external,
      reason: p.parent_reason,
      student_text: `「${p.parent_name}」学习仍有欠缺`,
      teacher_text: `「${p.parent_name}」再讲一下吧`,
      action: `先补「${p.parent_name}」，再回练「${p.name}」`
    }));
  }

  function moduleTags(kp){
    return [
      {c: "重要性", l: kp.importance},
      ...kp.tags.map(t => ({c: "知识点类型", l: t})),
      ...kp.error_tendency.map(t => ({c: "错因倾向", l: t})),
      {c: "上级知识点追溯", l: kp.parent_id ? "有上级" : "无上级"}
    ];
  }
  function moduleText(c, l){
    const m = D.modules.find(x => x["模块类别"] === c && x["模块标签"] === l);
    return m ? m["可拼接建议话术"] : "";
  }
  function teachingAdvice(students, points){
    const counter = new Map();
    const seenStudent = new Map();
    students.forEach(s => {
      const seen = new Set();
      s.weak_points.forEach(p => {
        moduleTags(p).forEach(t => {
          const k = t.c + "|" + t.l;
          if (seen.has(k)) return;
          seen.add(k);
          counter.set(k, (counter.get(k) || 0) + 1);
        });
      });
    });
    const total = students.length || 1;
    const all = Array.from(counter.entries()).map(([k, count]) => {
      const [c, l] = k.split("|");
      return {category: c, label: l, count, share: count / total, text: moduleText(c, l)};
    }).sort((a, b) => b.count - a.count);
    const pick = (cat, n) => all.filter(x => x.category === cat).slice(0, n);
    const imp = pick("重要性", 1), types = pick("知识点类型", 1), errs = pick("错因倾向", 1);
    const focus = all.filter(x => x.category === "知识点类型" || x.category === "错因倾向").slice(0, 3);
    const topPoints = points.slice().sort((a, b) => b.err - a.err).slice(0, 3);
    const actions = [];
    if (focus.length) actions.push(`班课先按「${focus.map(x => x.label).join("」「")}」组织一轮 10 分钟微专题。`);
    actions.push(`用「${topPoints.map(p => p.name).join("」「")}」做当堂变式，先补前置节点再回练。`);
    actions.push("对重点关注对象按个人建议单独立项，三天后回收同型题正确率。");
    const ranked = ["重要性", "知识点类型", "错因倾向"].map(c => all.find(x => x.category === c)).filter(Boolean);
    const lead = ranked.length ? `全班 ${students.length} 人的建议汇总起来，「${ranked.map(x => x.label).join("」「")}」这几类最突出。` : "";
    const parts = [];
    imp.concat(types, errs).forEach(x => parts.push(x.text));
    return {
      sample_size: students.length, top_modules: all.slice(0, 12),
      paragraph: lead + "\n" + parts.join("\n"),
      actions
    };
  }
  function attentionList(students){
    const rows = students.map(s => {
      const weakAll = s.points.filter(p => p.attempts >= CONFIG.attention.min_attempts && p.err >= CONFIG.attention.weak_error_rate)
        .sort((a, b) => b.err - a.err);
      return {
        id: s.id, class: s.class, rate: s.rate, weak_count: weakAll.length,
        weak_points: weakAll.slice(0, 4).map(p => ({id: p.id, name: p.name, error_rate: p.err}))
      };
    });
    rows.sort((a, b) => b.weak_count - a.weak_count || a.rate - b.rate || a.id.localeCompare(b.id));
    rows.forEach((r, i) => {
      r.attention_rank = i + 1;
      r.level = r.weak_count >= 5 ? "高" : (r.weak_count >= 3 ? "中" : "低");
    });
    return rows;
  }

  /* ---------- mind map：首页思维导图（inline SVG，无外部依赖） ---------- */
  /* 可调节：节点坐标来自 model.json 的 mindmap，紫=记忆型 蓝=逻辑型 */
  function renderMap(){
    const mm = D.mindmap;
    const nodes = mm.nodes;
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    function dims(n){ return n.kind === "point" ? {w: 210, h: 76} : {w: 150, h: 44}; }
    function anchor(a, b){
      const da = dims(a), db = dims(b);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.max(0.001, Math.hypot(dx, dy));
      const ux = dx / len, uy = dy / len;
      const t1 = Math.min((da.w / 2) / Math.max(0.001, Math.abs(ux)), (da.h / 2) / Math.max(0.001, Math.abs(uy)));
      const t2 = Math.min((db.w / 2) / Math.max(0.001, Math.abs(ux)), (db.h / 2) / Math.max(0.001, Math.abs(uy)));
      return {x1: a.x + ux * t1, y1: a.y + uy * t1, x2: b.x - ux * t2, y2: b.y - uy * t2};
    }
    const edges = mm.edges.map(e => {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) return "";
      const p = anchor(a, b);
      const mx = (p.x1 + p.x2) / 2, my = (p.y1 + p.y2) / 2;
      const vertical = Math.abs(p.x2 - p.x1) < Math.abs(p.y2 - p.y1);
      const d = vertical
        ? `M${p.x1},${p.y1} C${p.x1},${my} ${p.x2},${my} ${p.x2},${p.y2}`
        : `M${p.x1},${p.y1} C${mx},${p.y1} ${mx},${p.y2} ${p.x2},${p.y2}`;
      return `<path d="${d}" fill="none" stroke="${e.kind === "main" ? "#8A8066" : (e.kind === "cross" ? "#C9A65A" : "#B8AD92")}" stroke-width="${e.kind === "main" ? 1.7 : 1.3}" ${e.kind === "cross" ? 'stroke-dasharray="6 4"' : (e.kind === "foundation" ? 'stroke-dasharray="2 4"' : "")} marker-end="url(#ar-${e.kind})" opacity=".9"/>`;
    }).join("");

    const pointNodes = nodes.filter(n => n.kind === "point");
    const themeHeads = mm.themes.map(t => {
      const xs = t.points.map(id => byId[id].x);
      const x = xs.reduce((a, b) => a + b, 0) / xs.length;
      return `<g>
        <text x="${x}" y="146" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7B765C" font-weight="700">${esc(t.id)}</text>
        <text x="${x}" y="163" text-anchor="middle" font-size="13.5" fill="#3C4031" font-weight="700">${esc(t.name)}</text>
        <line x1="${x - 118}" y1="172" x2="${x + 118}" y2="172" stroke="#CFC3A4" stroke-width="1"/>
      </g>`;
    }).join("");

    const nodeSvg = nodes.map(n => {
      const d = dims(n);
      if (n.kind === "foundation"){
        return `<g class="node" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="前置基础 ${esc(n.name)}">
          <rect class="node-bg" x="${n.x - d.w / 2}" y="${n.y - d.h / 2}" width="${d.w}" height="${d.h}" rx="12" fill="#EDE5D2" stroke="#B8AD92" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="12" fill="#4E4B3A" font-weight="600">${esc(n.name)}</text>
          <title>${esc(n.name)}：${esc(n.detail || "")}</title>
        </g>`;
      }
      const color = n.type === "记忆型" ? "#A83322" : "#175E68";
      const bg = n.type === "记忆型" ? "#F2DCD4" : "#DCE8E3";
      const lines = splitLines(n.name, 12, 2);
      const lineSvg = lines.length === 1
        ? `<text x="${n.x - 94}" y="${n.y + 4}" class="node-title" font-size="14.5" fill="#1B1D17" font-weight="700">${esc(lines[0])}</text>`
        : `<text x="${n.x - 94}" y="${n.y - 2}" class="node-title" font-size="14" fill="#1B1D17" font-weight="700">${esc(lines[0])}</text><text x="${n.x - 94}" y="${n.y + 17}" class="node-title" font-size="14" fill="#1B1D17" font-weight="700">${esc(lines[1])}</text>`;
      return `<g class="node" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}，错误率 ${esc(n.error_rate_text)}">
        <rect class="node-bg" x="${n.x - d.w / 2}" y="${n.y - d.h / 2}" width="${d.w}" height="${d.h}" rx="12" fill="${bg}" stroke="${color}" stroke-width="1.2"/>
        <path d="M${n.x - d.w / 2 + 7},${n.y - d.h / 2} h-1 a6,6 0 0 0 -6,6 v${d.h - 12} a6,6 0 0 0 6,6 h1 z" fill="${color}"/>
        <rect x="${n.x - d.w / 2 + 2}" y="${n.y - d.h / 2 + 10}" width="6" height="${d.h - 20}" rx="3" fill="${color}"/>
        <text x="${n.x - 94}" y="${n.y - 23}" font-size="9.5" letter-spacing="1" fill="#6A6650" font-weight="600">${esc(n.id)} · ${esc(n.type)}</text>
        <rect x="${n.x + 36}" y="${n.y - 32}" width="66" height="18" rx="12" fill="#FBF6E8" opacity=".9"/>
        <text x="${n.x + 69}" y="${n.y - 19}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${esc(n.error_rate_text)}</text>
        ${lineSvg}
        <text x="${n.x - 94}" y="${n.y + 34}" font-size="9.5" fill="#6A6650">${esc(n.importance)} · ${esc(n.tier)}</text>
      </g>`;
    }).join("");

    return `<svg class="map" id="map-svg" viewBox="0 0 ${mm.canvas.width} ${mm.canvas.height}" role="img" aria-label="知识点思维导图">
      <defs>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B1D17" flood-opacity=".08"/></filter>
        <marker id="ar-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8066"/></marker>
        <marker id="ar-cross" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C9A65A"/></marker>
        <marker id="ar-foundation" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B8AD92"/></marker>
      </defs>
      ${themeHeads}
      ${edges}
      ${nodeSvg}
    </svg>`;
  }

        <article class="card how-card"><span class="how-num">02</span><h4>定位漏洞</h4><p>个人错题按知识点归堆，先看错得最多的三个；再顺着前置关系往上找，那句“这题不会”往往能落到某个更早的概念上。</p></article>
        <article class="card how-card"><span class="how-num">03</span><h4>给出动作</h4><p>学生端给出一句话的个人建议，教师端把最高频的建议模块汇总成班课动作，顺带圈出要重点关注的学生。</p></article>
      </div>
    </section>`;
  }

  /* ---------- student：学生端（个人高频易错 + 学习建议 + 学习预警） ---------- */
  function renderStudent(){
    const s = M.students.find(x => x.id === STATE.student) || M.students[0];
    if (!s) return `<div class="wrap"><div class="empty">暂无学生数据</div></div>`;
    const options = M.classes ? Object.keys(M.classes).map(c => {
      const rows = M.students.filter(x => x.class === c);
      return `<optgroup label="${esc(c)}">${rows.map(r => `<option value="${esc(r.id)}" ${r.id === s.id ? "selected" : ""}>${esc(r.id)} · ${pct(r.rate)}</option>`).join("")}</optgroup>`;
    }).join("") : "";
    const weak = s.weak_points;
    const heat = KP.map(kp => {
      const p = M.byId[kp.id];
      const sp = s.points.find(x => x.id === p.id);
      if (!sp) return `<button class="m-weak no-data" disabled><div class="hid">${esc(p.id)}</div><div class="hname">${esc(p.name)}</div><div class="hval" style="color:#8A8468">未作答</div></button>`;
      return `<button class="${masteryClass(sp.mastery)}" data-point="${esc(p.id)}" title="点击查看教材例题与建议">
        <div class="hid">${esc(p.id)} · ${esc(sp.mastery)}</div>
        <div class="hname">${esc(p.name)}</div>
        <div class="hval" style="color:${sp.err >= 0.4 ? "var(--purple)" : (sp.err > 0.2 ? "var(--gold)" : "var(--teal)")}">${pct(sp.err)}</div>
        <div class="hbar"><i style="width:${Math.max(4, sp.err * 100)}%;background:${sp.err >= 0.4 ? "var(--purple)" : (sp.err > 0.2 ? "var(--gold)" : "var(--teal)")}"></i></div>
      </button>`;
    }).join("");

    return `
    <section class="wrap">
      <div class="page-head">
        <div><p class="eyebrow">STUDENT VIEW · 个人画像</p><h1>错题看懂了，下一步练什么</h1><div class="sub">个人易错高频考点 · 学习建议 · 学习预警</div></div>
        <div class="selectors"><label class="sr" for="studentSel">选择学生</label><select class="select" id="studentSel">${options}</select></div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><span>个人得分率</span><b>${pct(s.rate)}</b><small>${num(s.score)} / ${num(s.full)} 分</small></div>
        <div class="kpi"><span>班内排名</span><b>${s.class_rank || "-"}<small style="font-size:12px"> / ${s.class_size || "-"}</small></b><small>${esc(s.class)}</small></div>
        <div class="kpi"><span>高频易错点</span><b>${weak.length}</b><small>错误率 ≥ ${pct(BASE, 0)} 的前三个</small></div>
        <div class="kpi"><span>已覆盖知识点</span><b>${s.points.length}<small style="font-size:12px"> / ${M.points.length}</small></b><small>作答 ${s.attempts} 条</small></div>
      </div>

      <div class="profile">
        <div class="card profile-main">
          <div class="avatar">${esc(s.id)}</div>
          <div><h2>${esc(s.id)} 的学习画像</h2><div class="meta">${esc(s.class)} · 七年级 · 已作答 ${s.attempts} 条 · 覆盖 ${s.points.length} 个知识点</div>
            <div class="wc-tags" style="margin-top:9px">${s.points.slice().sort((a,b)=>b.err-a.err).slice(0,3).map(p=>`<span class="badge plain">${esc(p.id)}</span>`).join("")}</div>
          </div>
          <div class="ring" style="--p:${(s.rate * 100).toFixed(1)}"><i>${pct(s.rate, 0)}</i></div>
        </div>
        <div class="card mastery-box">
          <div><b style="color:var(--teal)">${s.mastery_counts["掌握"]}</b><span>掌握</span></div>
          <div><b style="color:var(--gold)">${s.mastery_counts["部分掌握"]}</b><span>部分掌握</span></div>
          <div><b style="color:var(--purple)">${s.mastery_counts["未掌握"]}</b><span>未掌握</span></div>
        </div>
      </div>

      <div class="grid-2">
        <section class="card panel">
          <h3>个人易错高频考点</h3>
          <p class="ph-sub">按自己的错误率从高到低，取前三个；每一条后面都配了怎么练。</p>
          ${weak.length ? weak.map((p, i) => {
            const lost = p.full - p.score;
            return `<article class="weak-card">
              <div class="wc-head">
                <div class="rankbox">0${i + 1}</div>
                <div style="flex:1;min-width:0">
                  <p class="wc-title">${esc(p.name)}</p>
                  <div class="wc-tags">${typeBadge(p.primary_type)}<span class="badge plain">${esc(p.id)}</span>${p.tags.filter(t => t !== p.primary_type).map(t => `<span class="badge plain">${esc(t)}</span>`).join("")}<span class="badge ${p.mastery === "未掌握" ? "memory" : (p.mastery === "掌握" ? "logic" : "plain")}">${esc(p.mastery)}</span></div>
                </div>
                <div class="rate"><b style="color:${p.err >= 0.4 ? "var(--purple)" : (p.err > 0.2 ? "var(--gold)" : "var(--teal)")}">${pct(p.err)}</b><span>错误率</span></div>
              </div>
              <div class="bar"><i style="width:${Math.max(3, p.err * 100)}%"></i></div>
              <div class="wc-meta"><span>作答 ${p.attempts} 次 · 失分 ${num(lost)} / ${num(p.full)}</span><span>${esc(p.importance)} · ${esc(p.pages)}</span></div>
              <details class="advice"><summary>查看这条知识点的学习建议</summary><p>${esc(p.advice)}</p></details>
            </article>`;
          }).join("") : `<div class="empty">暂无明显薄弱点，继续保持。</div>`}
        </section>

        <aside class="warn-side">
          <section class="card panel">
            <h3>学习预警</h3>
            <p class="ph-sub">取自己错得最多的三个点，顺着前置关系往上找一层，看看卡在哪个更早的概念上。</p>
            ${s.warnings.map(w => `
              <article class="warn-card">
                <div class="warn-kicker">预警 0${w.rank} · ${esc(w.point_id)}</div>
                <div class="warn-trigger"><b>${esc(w.point_name)}</b> 错误率 ${pct(w.error_rate)} · 作答 ${w.attempts || "-"} 次</div>
                <div class="warn-arrow">↑ 可能未听懂</div>
                <p class="warn-parent">「${esc(w.parent_name)}」<span style="font-size:11px;color:#7C2417;font-weight:600">学习仍有欠缺</span></p>
                <p class="warn-reason">${esc(w.reason)}</p>
                <div class="warn-chips"><span class="chip student">先补前置，再回练当前点</span></div>
              </article>`).join("")}
          </section>
          <div class="advice-dark">
            <h4>学习建议 · 一句话版</h4>
            <p>${esc(s.advice_summary)}</p>
          </div>
        </aside>
      </div>

      <section class="card panel mt16">
        <h3>九个知识点的个人掌握热力</h3>
        <p class="ph-sub">墨绿为掌握，奶油黄为部分掌握，朱砂为未掌握；点开任一格查看教材例题、推导与课后习题。</p>
        <div class="heat">${heat}</div>
      </section>
    </section>`;
  }

  /* ---------- teacher：教师端（重点汇总 / 成绩分析 / 两班对比 / 重点关注） ---------- */
  function renderTeacher(){
    const cls = STATE.teacherClass;
    const all = cls === "ALL";
    const students = all ? M.students : M.students.filter(s => s.class === cls);
    const points = M.points.map(p => all ? p : {
      ...p,
      err: p.classRates[cls] ? p.classRates[cls].err : p.err,
      rate: p.classRates[cls] ? p.classRates[cls].rate : p.rate,
      attempts: p.classRates[cls] ? p.classRates[cls].attempts : 0
    });
    const classInfo = all ? null : M.classes[cls];
    const avg = all ? students.reduce((a, s) => a + s.rate, 0) / Math.max(1, students.length) : classInfo.avg;
    const pass = all ? students.filter(s => s.rate >= 0.6).length / Math.max(1, students.length) : classInfo.pass;
    const excellent = all ? students.filter(s => s.rate >= 0.85).length / Math.max(1, students.length) : classInfo.excellent;
    const warnings = all ? M.warnings : warningsFor(points, 3);
    const teaching = all ? M.teaching : teachingAdvice(students, points);
    const attention = all ? M.attention : attentionList(students);
    const attentionHigh = attention.filter(a => a.level === "高").length;
    const dist = all ? [
      {label: "不及格", range: "0—59%", count: students.filter(s => s.rate < 0.6).length},
      {label: "及格", range: "60—69%", count: students.filter(s => s.rate >= 0.6 && s.rate < 0.7).length},
      {label: "良好", range: "70—84%", count: students.filter(s => s.rate >= 0.7 && s.rate < 0.85).length},
      {label: "优秀", range: "85—100%", count: students.filter(s => s.rate >= 0.85).length}
    ] : classInfo.distribution;
    const maxDist = Math.max(1, ...dist.map(d => d.count));
    const themes = D.mindmap.themes.map(t => {
      const pts = t.points.map(id => points.find(p => p.id === id)).filter(Boolean);
      const score = pts.reduce((a, p) => a + (p.classRates && !all && p.classRates[cls] ? p.classRates[cls].score : p.score), 0);
      const full = pts.reduce((a, p) => a + (p.classRates && !all && p.classRates[cls] ? p.classRates[cls].full : p.full), 0);
      return {...t, err: full ? 1 - score / full : 0};
    });
    const cids = Object.keys(M.classes);
    const focusCount = points.filter(p => p.tier === "重点").length;
    const midCount = points.filter(p => p.tier === "次重点").length;
    const noteCount = points.filter(p => p.tier === "注意点").length;

    return `
    <section class="wrap">
      <div class="page-head">
        <div><p class="eyebrow">TEACHER VIEW · 班级驾驶舱</p><h1>先看共性，再找具体的人</h1><div class="sub">重点知识点汇总 · 成绩分析 · 两班对比 · 重点关注对象 · 教学建议</div></div>
        <div class="selectors">
          <div class="seg" id="classSeg">${["ALL", ...cids].map(c => `<button data-class="${esc(c)}" class="${c === cls ? "active" : ""}">${c === "ALL" ? "全部班级" : esc(c)}</button>`).join("")}</div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi"><span>平均得分率</span><b>${pct(avg)}</b><small>${students.length} 名学生</small></div>
        <div class="kpi"><span>及格率</span><b>${pct(pass)}</b><small>得分率 ≥ 60%</small></div>
        <div class="kpi"><span>优秀率</span><b>${pct(excellent)}</b><small>得分率 ≥ 85%</small></div>
        <div class="kpi"><span>重点关注对象</span><b>${attentionHigh}<small style="font-size:12px"> 人</small></b><small>薄弱点 ≥ 5 个</small></div>
      </div>

      <section class="card panel">
        <h3>重点知识点汇总</h3>
        <p class="ph-sub">按错误率从高到低排：最高的三成是重点（${focusCount} 个），中间四成是次重点（${midCount} 个），剩下三成算注意点（${noteCount} 个）。${all ? "" : `当前显示 ${esc(cls)} 的错误率；分层仍按全年级口径。`}</p>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>#</th><th>知识点</th><th>类型</th><th>错误率${all ? "" : "（" + esc(cls) + "）"}</th><th>层级</th><th>${cids.map(c => esc(c)).join(" / ")}</th><th>前置节点</th></tr></thead>
            <tbody>${points.map(p => `
              <tr>
                <td style="font-family:var(--serif);color:#A67C2E">${String(p.rank).padStart(2, "0")}</td>
                <td><div class="pt-name">${esc(p.name)}</div><div class="pt-id">${esc(p.id)} · ${esc(p.importance)}</div></td>
                <td>${typeBadge(p.primary_type)}</td>
                <td><div style="display:flex;align-items:center;gap:8px"><div class="mini-bar" style="flex:1"><i style="width:${Math.max(3, p.err * 100)}%;background:${p.err >= 0.45 ? "var(--purple)" : (p.err >= BASE ? "var(--gold)" : "var(--teal)")}"></i></div><b style="font-family:var(--serif);font-size:12px">${pct(p.err)}</b></div></td>
                <td><span class="tier ${tierClass(p.tier)}">${esc(p.tier)}</span></td>
                <td style="font-size:11px;color:#5A5744">${cids.map(c => `<span style="display:inline-block;min-width:52px">${p.classRates[c] ? pct(p.classRates[c].err, 0) : "—"}</span>`).join("")}</td>
                <td style="font-size:11px;color:#6A6650">${esc(p.parent_name)}</td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </section>

      <div class="two-col mt16">
        <section class="card panel">
          <h3>成绩分布</h3><p class="ph-sub">按学生个人总得分率分档，观察尾部与头部。</p>
          ${dist.map(d => `<div class="chart-row"><span class="lab">${esc(d.label)} <span style="color:#8A8468">${esc(d.range)}</span></span><div class="track"><i style="width:${(d.count / maxDist) * 100}%"></i></div><span class="val">${d.count} 人</span></div>`).join("")}
        </section>
        <section class="card panel">
          <h3>主题得分率</h3><p class="ph-sub">三个主题的加权得分率，快速判断先补哪一块。</p>
          ${themes.map(t => `<div class="chart-row"><span class="lab">${esc(t.id)} ${esc(t.name)}</span><div class="track ${t.err >= 0.45 ? "purple" : ""}"><i style="width:${Math.max(3, (1 - t.err) * 100)}%"></i></div><span class="val">${pct(1 - t.err)}</span></div>`).join("")}
          <div class="hint">主题得分率：把该主题所有知识点的得分合起来，再除以满分合计；不能拿三个知识点的百分比直接平均。</div>
        </section>
      </div>

      <section class="card panel mt16">
        <h3>两班对比</h3><p class="ph-sub">逐知识点对比错误率；差值超过 10 个百分点标朱砂，提示两班教学进度或掌握结构存在差异。</p>
        <div class="compare-row" style="font-size:10px;color:#6A6650;letter-spacing:.08em"><span>知识点</span><span>${esc(cids[0] || "班级一")}</span><span>${esc(cids[1] || "班级二")}</span><span style="text-align:right">差值</span></div>
        ${points.map(p => {
          const a = p.classRates[cids[0]] ? p.classRates[cids[0]].err : null;
          const b = p.classRates[cids[1]] ? p.classRates[cids[1]].err : null;
          const gap = a != null && b != null ? Math.abs(a - b) : null;
          return `<div class="compare-row">
            <span><b style="font-weight:600">${esc(p.name)}</b><span style="color:#8A8468;margin-left:5px;font-size:9.5px">${esc(p.id)}</span></span>
            <div class="dual"><div class="track"><i style="width:${a == null ? 0 : Math.max(3, a * 100)}%"></i></div><span style="font-size:9.5px;color:#6E8088">${a == null ? "—" : pct(a)}</span></div>
            <div class="dual c2"><div class="track"><i style="width:${b == null ? 0 : Math.max(3, b * 100)}%"></i></div><span style="font-size:9.5px;color:#6E8088">${b == null ? "—" : pct(b)}</span></div>
            <span class="gap ${gap != null && gap > 0.1 ? "warn" : ""}">${gap == null ? "—" : (gap * 100).toFixed(1) + "pp"}</span>
          </div>`;
        }).join("")}
        <div class="two-col mt16">
          ${cids.map(c => {
            const ci = M.classes[c];
            return `<div style="background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.72);border-left:3px solid var(--accent);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px)">
              <div style="font-size:11px;letter-spacing:.1em;color:#7B765C;font-weight:700">${esc(c)}</div>
              <div style="display:flex;gap:18px;margin-top:6px;flex-wrap:wrap"><span style="font-size:11px;color:#5A5744">平均 <b style="font-family:var(--serif);font-size:16px;color:#24271C">${pct(ci.avg)}</b></span><span style="font-size:11px;color:#5A5744">及格 <b style="font-family:var(--serif);font-size:16px;color:#24271C">${pct(ci.pass)}</b></span><span style="font-size:11px;color:#5A5744">优秀 <b style="font-family:var(--serif);font-size:16px;color:#24271C">${pct(ci.excellent)}</b></span></div>
            </div>`;
          }).join("")}
        </div>
      </section>

      <section class="card panel mt16">
        <h3>重点关注对象</h3><p class="ph-sub">什么算薄弱点：同一个知识点至少做过 2 次、错误率 ≥ 40%；按薄弱点个数从多到少排，个数一样时看总分。</p>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>#</th><th>学生</th><th>班级</th><th>得分率</th><th>薄弱点</th><th>主要薄弱知识点</th><th>关注级别</th></tr></thead>
            <tbody>${attention.slice(0, all ? 8 : 6).map(a => `
              <tr>
                <td style="font-family:var(--serif);color:#A67C2E">${String(a.attention_rank).padStart(2, "0")}</td>
                <td><b>${esc(a.id)}</b></td><td>${esc(a.class)}</td><td>${pct(a.rate)}</td><td>${a.weak_count} 个</td>
                <td><div class="weakchips">${a.weak_points.slice(0, 3).map(w => `<span>${esc(w.name)} ${pct(w.error_rate, 0)}</span>`).join("")}</div></td>
                <td><span class="att-level ${a.level === "高" ? "lv-high" : (a.level === "中" ? "lv-mid" : "lv-low")}">${esc(a.level)}</span></td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </section>

      <div class="two-col mt16">
        <section class="card panel">
          <h3>教学建议</h3><p class="ph-sub">汇总学生端出现最多的学习建议模块，落到班级层面的教学动作上。</p>
          <div class="teaching-para">${esc(teaching.paragraph || "暂无足够数据生成教学建议。")}</div>
          <ul class="action-list">${teaching.actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
          <div class="module-cloud">${teaching.top_modules.slice(0, 8).map(m => `<span>${esc(m.category)} · ${esc(m.label)} <b>${m.count}</b></span>`).join("")}</div>
          <div class="hint">统计办法：每人的前三个薄弱点各算一次；同一个人同一个模块只记一次，免得被反复放大。</div>
        </section>
        <section class="card panel">
          <h3>班级学习预警</h3><p class="ph-sub">取错误率最高的三个点，再顺着前置关系往上找：那句“没听懂”可能出在更早的地方。</p>
          ${warnings.map(w => `
            <article class="warn-card" style="margin-bottom:10px">
              <div class="warn-kicker">预警 0${w.rank} · ${esc(w.point_id)}</div>
              <div class="warn-trigger"><b>${esc(w.point_name)}</b> 错误率 ${w.error_rate_text}</div>
              <div class="warn-arrow">↑ 建议再讲</div>
              <p class="warn-parent">「${esc(w.parent_name)}」<span style="font-size:11px;color:#175E68;font-weight:600">再讲一下吧</span></p>
              <p class="warn-reason">${esc(w.reason)}</p>
              <div class="warn-chips"><span class="chip teacher">${esc(w.action)}</span></div>
            </article>`).join("")}
        </section>
      </div>

      <details class="card import-card mt16" id="importCard">
        <summary>接入新数据，用同一套模型跑一遍（JSON / CSV）</summary>
        <div class="import-row">
          <input class="file-input" type="file" id="importFile" accept=".json,.csv">
          <button class="btn btn-primary" id="loadSample" style="padding:8px 15px;font-size:12px">载入 4 人示例</button>
          <button class="btn btn-ghost" id="resetData" style="padding:8px 15px;font-size:12px">恢复演示数据</button>
          <span id="importStatus" style="font-size:11px;color:#6A6650"></span>
        </div>
        <div class="hint">
          JSON：<span class="code">{ "students": [{ "id": "S01", "class": "A班" }], "responses": [{ "student": "S01", "indicator": "T01I1", "score": 1, "full": 1 }] }</span><br>
          CSV 列名：<span class="code">student,indicator,score,full</span>，UTF-8 编码。未知知识点、满分 ≤ 0、得分越界的记录会被自动过滤，并在下方提示。
        </div>
      </details>
    </section>`;
  }

  /* ---------- drawer：知识点详情抽屉（例题 / 推导 / 课后习题 / 教材证据） ---------- */
  function openPoint(pid){
    const c = D.content[pid];
    const p = M.byId[pid];
    if (!c || !p) return;
    const sp = (M.students.find(s => s.id === STATE.student) || {}).points?.find(x => x.id === pid);
    const drawer = $("#drawer");
    const overall = p;
    const classRates = Object.entries(overall.classRates || {}).map(([k, v]) => `<span class="stat-mini" style="display:block"><span>${esc(k)}</span><b>${pct(v.err)}</b></span>`).join("");
    drawer.innerHTML = `
      <div class="drawer-head">
        <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
        <div class="did">${esc(p.id)} · ${esc(p.theme)} · ${esc(p.pages)}</div>
        <h2>${esc(p.name)}</h2>
        <div class="drawer-meta"><span>${esc(p.tags.join(" / "))}</span><span>${esc(p.importance)}</span><span>全班错误率 ${pct(p.err)}</span>${sp ? `<span>我的错误率 ${pct(sp.err)}</span>` : ""}</div>
      </div>
      <div class="tabs" role="tablist">
        <button data-tab="example" class="active">教材例题</button>
        <button data-tab="derive">推导过程</button>
        <button data-tab="exercise">课后习题</button>
        <button data-tab="data">学情数据</button>
        <button data-tab="advice">学习建议</button>
      </div>
      <div class="drawer-body">
        <section class="tabpane active" data-pane="example">
          <div class="prompt">${esc(c.example.prompt)}</div>
          <div style="margin-top:14px">${c.example.steps.map(s => `<div class="stepline"><b>${esc(s.label)}</b><div>${esc(s.content)}</div></div>`).join("")}</div>
          <div class="answerbox">${esc(c.example.answer)}</div>
          <div class="note">${esc(c.example.note)}</div>
          <div class="note" style="color:#8A8468">对应教材：${esc(c.example.pages)}</div>
        </section>

        <section class="tabpane" data-pane="derive">
          <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 10px">${esc(c.derivation.title)}</h3>
          <div>${c.derivation.steps.map(s => `<div class="stepline"><b>${esc(s.label)}</b><div>${esc(s.content)}</div></div>`).join("")}</div>
          <div class="conclusion">${esc(c.derivation.conclusion)}</div>
        </section>

        <section class="tabpane" data-pane="exercise">
          <p class="ph-sub" style="font-size:11.5px;color:#6A6650;margin:0 0 12px">${esc(c.exercise_note)} · 共 ${c.exercises.length} 题</p>
          ${c.exercises.map(q => `<article class="ex-card">
            <div class="ex-top"><span class="eid">${esc(q.id)}</span><span class="badge plain">${esc(q.type)}</span><span class="badge ${q.level === "基础" ? "logic" : "memory"}">${esc(q.level)}</span><span style="margin-left:auto;font-size:9.5px;color:#8A8468">${q.full} 分</span></div>
            <p class="ex-stem">${esc(q.stem)}</p>
            <details><summary>查看答案与解析</summary><div class="ex-answer"><b>答案：</b>${esc(q.answer)}<br><b>解析：</b>${esc(q.explanation)}</div></details>
          </article>`).join("")}
        </section>

        <section class="tabpane" data-pane="data">
          <div class="stat-split">
            <div class="stat-mini"><span>全班错误率</span><b style="color:${overall.err >= 0.45 ? "var(--purple)" : "var(--gold)"}">${pct(overall.err)}</b></div>
            <div class="stat-mini"><span>分层</span><b>${esc(overall.tier)}</b></div>
            <div class="stat-mini"><span>作答人次</span><b>${overall.attempts}</b></div>
            <div class="stat-mini"><span>掌握判定</span><b>${esc(overall.mastery)}</b></div>
          </div>
          ${sp ? `<div class="prompt" style="font-size:12px">我的作答：${sp.attempts} 次，得分 ${num(sp.score)} / ${num(sp.full)}，错误率 ${pct(sp.err)}，判定为「${esc(sp.mastery)}」。</div>` : `<div class="note">当前学生尚未作答该知识点。</div>`}
          <h4 style="font-size:12px;margin:16px 0 6px">两班错误率</h4>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${classRates || "<div class='note'>暂无分班数据</div>"}</div>
          <h4 style="font-size:12px;margin:16px 0 6px">前置关系</h4>
          <div class="note">直接前置节点：<b>${esc(p.parent_name)}</b>${p.parent_external ? "（思维导图外的基础节点）" : "（导图内节点）"}。${esc(p.parent_reason)}</div>
          <div class="note">教材原文依据：</div>
          ${c.evidence.map(e => `<div class="err-card" style="border-left-color:var(--gold);background:#F6EEDB"><b>${esc(e.title)}</b> <span style="color:#8A8468">${esc(e.chapter)} · 第 ${e.page} 页</span><span>${esc(e.quote)}</span></div>`).join("")}
        </section>

        <section class="tabpane" data-pane="advice">
          <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 8px">这条知识点的学习建议</h3>
          <div class="teaching-para">${esc(p.advice)}</div>
          <h4 style="font-size:13px;margin:18px 0 6px">常见错误</h4>
          ${c.common_errors.map(e => `<div class="err-card"><b>${esc(e.error)}</b><span>${esc(e.fix)}</span></div>`).join("")}
          <h4 style="font-size:13px;margin:18px 0 6px">提分小提示</h4>
          <ul class="tip-list">${c.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        </section>
      </div>`;
    drawer.classList.add("on");
    drawer.setAttribute("aria-hidden", "false");
    $("#drawer-overlay").classList.add("on");
    document.body.style.overflow = "hidden";
    $("#drawerClose").onclick = closeDrawer;
    $$(".tabs button", drawer).forEach(btn => btn.onclick = () => {
      $$(".tabs button", drawer).forEach(b => b.classList.remove("active"));
      $$(".tabpane", drawer).forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      const pane = $(`.tabpane[data-pane="${btn.dataset.tab}"]`, drawer);
      if (pane) pane.classList.add("active");
    });
    drawer.scrollTop = 0;
  }
  function closeDrawer(){
    $("#drawer").classList.remove("on");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#drawer-overlay").classList.remove("on");
    document.body.style.overflow = "";
  }

  /* ---------- bindings ---------- */
  function bindHome(){
    $$("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
    const svg = $("#map-svg");
    if (svg){
      const activate = id => {
        if (KPMAP[id]) openPoint(id);
        else {
          const n = D.mindmap.nodes.find(x => x.id === id);
          if (n) toast(`前置基础：${n.name} · ${n.detail || ""}`);
        }
      };
      svg.addEventListener("click", e => {
        const g = e.target.closest("[data-node]");
        if (g) activate(g.dataset.node);
      });
      svg.addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const g = e.target.closest("[data-node]");
        if (g){ e.preventDefault(); activate(g.dataset.node); }
      });
      $$(".theme-card").forEach(card => card.onclick = () => { $("#map-section").scrollIntoView({behavior:"smooth", block:"start"}); });
    }
  }
  function bindStudent(){
    const sel = $("#studentSel");
    if (sel) sel.onchange = () => { STATE.student = sel.value; render(); };
    $$("[data-point]").forEach(b => b.onclick = () => openPoint(b.dataset.point));
  }
  function bindTeacher(){
    $$("#classSeg button").forEach(b => b.onclick = () => { STATE.teacherClass = b.dataset.class; render(); });
    $$("tbody tr").forEach(() => {});
    const file = $("#importFile");
    if (file) file.onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const result = f.name.toLowerCase().endsWith(".csv") ? parseCSV(text) : parseJSON(text);
          applyImport(result.students, result.responses, result.note);
        } catch (err) {
          toast("导入失败：" + err.message);
        }
      };
      reader.readAsText(f, "utf-8");
    };
    const sample = $("#loadSample");
    if (sample) sample.onclick = loadSampleData;
    const reset = $("#resetData");
    if (reset) reset.onclick = () => {
      STUDENTS = D.students.map(s => ({...s}));
      RAW = D.responses.map(r => ({...r}));
      STATE.dataset = "demo";
      M = computeModel(STUDENTS, RAW);
      STATE.student = M.students[0].id;
      const st = $("#importStatus");
      if (st) st.textContent = "已恢复演示数据";
      render();
      toast("已恢复 40 名学生、813 条作答的演示数据");
    };
    // 点击表格行打开学生
    $$("tbody tr[data-student]").forEach(tr => tr.onclick = () => {
      STATE.student = tr.dataset.student;
      location.hash = "student";
    });
  }
  function render(){
    const view = $("#view");
    if (STATE.view === "home") view.innerHTML = renderHome();
    else if (STATE.view === "student") view.innerHTML = renderStudent();
    else view.innerHTML = renderTeacher();
    $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === STATE.view));
    if (STATE.view === "home") bindHome();
    else if (STATE.view === "student") bindStudent();
    else bindTeacher();
  }

  /* ---------- import：机器接入（粘贴 JSON / 上传 CSV 后重算） ---------- */
  function normResp(r){
    const s = r.student ?? r.student_id ?? r.s ?? r.uid;
    const i = r.indicator ?? r.point ?? r.i ?? r.knowledge_id;
    const sc = Number(r.score ?? r.sc ?? r.points);
    const f = Number(r.full ?? r.f ?? r.max_score ?? r.full_score);
    if (!s || !i || !Number.isFinite(sc) || !Number.isFinite(f) || f <= 0 || sc < 0 || sc > f) return null;
    if (!KPMAP[i]) return null;
    return {s: String(s), i: String(i), sc, f};
  }
  function parseJSON(text){
    const obj = JSON.parse(text);
    const arr = Array.isArray(obj) ? obj : (obj.responses || obj.records || obj.data || []);
    const responses = arr.map(normResp).filter(Boolean);
    let students = Array.isArray(obj.students) ? obj.students.map(x => ({id: String(x.id ?? x.student ?? x.student_id), class: String(x.class ?? x.class_id ?? "导入数据"), grade: x.grade ?? 7})).filter(x => x.id) : [];
    if (!students.length){
      const ids = unique(responses.map(r => r.s));
      students = ids.map(id => {
        const old = STUDENTS.find(s => s.id === id);
        return {id, class: old ? old.class : "导入数据", grade: 7};
      });
    }
    const ids = new Set(students.map(s => s.id));
    responses.forEach(r => { if (!ids.has(r.s)){ students.push({id: r.s, class: "导入数据", grade: 7}); ids.add(r.s); } });
    return {students, responses, note: `JSON：${responses.length} 条有效作答，${students.length} 名学生`};
  }
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error("CSV 没有数据行");
    const head = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
    const idx = name => head.indexOf(name);
    const is = idx("student"), ii = idx("indicator"), isc = idx("score"), ifull = idx("full");
    if ([is, ii, isc, ifull].some(x => x < 0)) throw new Error("CSV 需要列 student,indicator,score,full");
    const responses = [];
    for (let k = 1; k < lines.length; k++){
      const cols = lines[k].split(",").map(c => c.trim().replace(/^"|"$/g, ""));
      const r = normResp({student: cols[is], indicator: cols[ii], score: cols[isc], full: cols[ifull]});
      if (r) responses.push(r);
    }
    const ids = unique(responses.map(r => r.s));
    const students = ids.map(id => {
      const old = STUDENTS.find(s => s.id === id);
      return {id, class: old ? old.class : "导入数据", grade: 7};
    });
    return {students, responses, note: `CSV：${responses.length} 条有效作答，${students.length} 名学生`};
  }
  function loadSampleData(){
    const responses = (D.sample.responses || []).map(normResp).filter(Boolean);
    const students = (D.sample.students || []).map(x => ({id: String(x.id), class: String(x.class || "示例班"), grade: x.grade || 7}));
    applyImport(students, responses, `示例数据：${responses.length} 条作答，${students.length} 名学生`);
  }
  function applyImport(students, responses, note){
    if (!students.length || !responses.length) throw new Error("没有有效记录");
    STUDENTS = students;
    RAW = responses;
    STATE.dataset = "imported";
    M = computeModel(STUDENTS, RAW);
    STATE.student = M.students[0].id;
    STATE.teacherClass = "ALL";
    const status = $("#importStatus");
    render();
    const st = $("#importStatus");
    if (st) st.textContent = note + "；已用同一模型重算";
    toast(note);
  }

  /* ---------- route：页面切换与初始化 ---------- */
  function route(){
    const v = (location.hash || "#home").slice(1);
    if (v.startsWith("point=")){
      STATE.view = "home";
      render();
      openPoint(v.slice(6));
      return;
    }
    const parts = v.split("/");
    if (parts[0] === "teacher" && parts[1] === "sample"){
      STATE.view = "teacher";
      render();
      loadSampleData();
      return;
    }
    if (parts[0] === "student" && parts[1] && M.students.some(s => s.id === parts[1])) STATE.student = parts[1];
    if (parts[0] === "teacher" && parts[1] && (parts[1] === "ALL" || M.classes[parts[1]])) STATE.teacherClass = parts[1];
    STATE.view = ["home","student","teacher"].includes(parts[0]) ? parts[0] : "home";
    render();
    window.scrollTo({top:0, behavior:"auto"});
  }
  $("#nav").addEventListener("click", e => {
    const b = e.target.closest("[data-view]");
    if (b) location.hash = b.dataset.view;
  });
  $("#drawer-overlay").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
  window.addEventListener("hashchange", route);

  M = computeModel(STUDENTS, RAW);
  if (!STATE.student && M.students.length) STATE.student = M.students[0].id;
  route();
})();
</script>
</body>
</html>
