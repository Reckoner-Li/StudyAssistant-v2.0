<!DOCTYPE html>
<!--
  ============================================================================
  智慧学伴 · 单文件网页模板
  ----------------------------------------------------------------------------
  这个文件是“页面骨架 + 交互逻辑”，本身没有数据。
  build_site.py 会把数据 JSON 替换到页面底部的数据占位符，输出 web/index.html。
  注意：占位符只在脚本里出现一次，注释里不要写出它的完整名字，否则会被一并替换。

  修改配色：只改 :root 里的 CSS 变量（见下）。
  修改分析口径：改 JS 里的 CONFIG（来自 model.json）或 computeModel 函数。
  修改文案/结构：按下面 JS 的分段注释定位（utils / analysis / mind map /
                home / student / teacher / drawer / import / route）。
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧学伴 · 七年级数学学习地图</title>
<style>
  /* ------------------------------------------------------------------------
     主题色板（可调节）
     红 = 记忆型 / 蓝色 = 逻辑型；其余为纸感底色与强调色
     ------------------------------------------------------------------------ */
  :root{
    /* 文字与底色：--ink 主文字，--paper 页面底色，--card 卡片底色 */
    --ink:#16242C; --ink2:#43565F; --muted:#74858C;
    --paper:#F4EFE4; --paper2:#FBF7EC; --card:#FFFCF6;
    --line:#E3DAC8; --line2:#EFE8DA;
    /* 强调色：--gold 金色点缀 */
    --gold:#B8892E; --gold2:#D9B96B;
    /* 类型色：--red 记忆型，--blue 逻辑型（改这里即可整站换色） */
    --red:#C24B36; --red-bg:#FBEAE5; --red-soft:#F6DDD5;
    --blue:#2D6AA0; --blue-bg:#E9F1FA;
    /* 辅助色：--teal 用于教师端/提示 */
    --teal:#0D7A6F; --teal-bg:#E3F1EE;
    --shadow:0 12px 34px rgba(30,42,48,.07);
    /* 字体：改这两行可整站替换字体 */
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
    radial-gradient(900px 480px at 8% -6%, #FFF8E7 0%, rgba(255,248,231,0) 62%),
    radial-gradient(760px 420px at 96% 4%, #EAF2F3 0%, rgba(234,242,243,0) 58%),
    var(--paper);
    color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
  select{font-family:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:#F0DFB8}
  .wrap{max-width:1280px;margin:0 auto;padding:0 26px}
  .topbar{position:sticky;top:0;z-index:60;background:rgba(20,32,39,.95);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
  .topbar .wrap{display:flex;align-items:center;gap:26px;height:66px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#E4C77C,#A97C25);display:grid;place-items:center;color:#17242C;font-family:var(--serif);font-weight:700;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .brand-name{display:block;font-size:14.5px;letter-spacing:.08em;font-weight:600;white-space:nowrap}
  .brand-sub{display:block;font-size:9.5px;letter-spacing:.2em;color:#93A6AE;margin-top:1px;white-space:nowrap}
  .nav{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.055);padding:4px;border-radius:999px}
  .nav button{padding:7px 17px;border-radius:999px;font-size:12.5px;color:#BFCDD2;transition:.18s}
  .nav button:hover{color:#fff}
  .nav button.active{background:#F2E6C8;color:#1A2A32;font-weight:600}
  .top-meta{font-size:10px;letter-spacing:.14em;color:#82979F;white-space:nowrap}
  main{min-height:70vh}
  .eyebrow{font-size:10.5px;letter-spacing:.26em;color:#92732F;font-weight:700;text-transform:uppercase;margin:0 0 13px}
  .hero{padding:58px 0 38px;display:grid;grid-template-columns:1.12fr .88fr;gap:52px;align-items:end}
  .hero h1{font-family:var(--serif);font-size:clamp(34px,4.3vw,54px);line-height:1.16;letter-spacing:-.015em;margin:0;font-weight:700}
  .hero h1 em{font-style:normal;color:var(--red);position:relative;white-space:nowrap}
  .hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:8px;background:#EFD9A9;z-index:-1}
  .hero .lead{margin:20px 0 0;color:#50636B;font-size:15px;max-width:560px;line-height:1.8}
  .hero-actions{display:flex;gap:11px;margin-top:27px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;transition:.18s;border:1px solid transparent}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:#243942;transform:translateY(-1px)}
  .btn-ghost{background:transparent;border-color:#CFC3AC;color:#33464E}
  .btn-ghost:hover{background:#FFFCF4}
  .snapshot{background:var(--ink);color:#fff;border-radius:22px;padding:24px 26px 18px;position:relative;overflow:hidden;box-shadow:0 24px 50px rgba(22,36,44,.16)}
  .snapshot::after{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(216,185,107,.34),transparent 68%)}
  .snapshot h3{font-size:11px;letter-spacing:.18em;color:#9FB2BA;font-weight:600;margin:0 0 10px}
  .snap-row{display:flex;align-items:baseline;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.09);position:relative;z-index:1}
  .snap-row:last-child{border-bottom:0}
  .snap-row span{font-size:12px;color:#A9BAC1}
  .snap-row b{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.01em}
  .snap-row b small{font-size:11px;font-family:var(--sans);color:#A9BAC1;font-weight:400;margin-left:3px}
  .section{padding:42px 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:20px}
  .sec-head h2{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0;letter-spacing:-.01em}
  .sec-head p{margin:6px 0 0;color:#60737B;font-size:13px;max-width:600px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
  .map-card{padding:20px 20px 12px;overflow:hidden}
  .map-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .legend{display:flex;gap:16px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#5B6F77}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .dot.memory{background:var(--red)} .dot.logic{background:var(--blue)} .dot.foundation{background:#B9B0A0}
  .map-note{font-size:11.5px;color:#7A8B92}
  .map-scroll{overflow-x:auto;padding:2px 0 0}
  svg.map{width:100%;min-width:960px;height:auto;display:block;font-family:var(--sans)}
  .map text{user-select:none}
  .node{cursor:pointer}
  .node .node-bg{transition:.16s}
  .node:hover .node-bg{filter:brightness(.975)}
  .node:focus{outline:none}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
  .theme-card{padding:20px 22px;border-top:4px solid var(--blue);position:relative;overflow:hidden}
  .theme-card[data-t="T02"]{border-top-color:var(--gold)}
  .theme-card[data-t="T03"]{border-top-color:var(--teal)}
  .theme-card .tid{font-size:10px;letter-spacing:.2em;color:#8A9AA0;font-weight:700}
  .theme-card h3{font-size:18px;margin:7px 0 4px;font-family:var(--serif)}
  .theme-card .goal{font-size:12px;color:#64777F;line-height:1.65;min-height:40px}
  .theme-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
  .theme-foot b{font-family:var(--serif);font-size:27px;line-height:1}
  .theme-foot span{font-size:10.5px;color:#84949B;display:block;margin-top:4px}
  .tier-pill{font-size:10px;padding:3px 8px;border-radius:99px;background:#F1E9D7;color:#7C6223;font-weight:600}
  .warn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
  .warn-card{padding:19px 20px;background:#FFF9F4;border:1px solid #EED9CF;border-left:4px solid var(--red);border-radius:14px}
  .warn-kicker{font-size:9.5px;letter-spacing:.18em;color:#A0523D;font-weight:700}
  .warn-trigger{font-size:12px;color:#6E7E84;margin:8px 0 2px}
  .warn-trigger b{color:#33474F;font-weight:600}
  .warn-arrow{color:#B0806F;font-size:16px;line-height:1;margin:7px 0 5px}
  .warn-parent{font-family:var(--serif);font-size:18.5px;line-height:1.4;font-weight:700;margin:0}
  .warn-reason{font-size:11.5px;color:#6B7B81;margin:8px 0 0;line-height:1.6}
  .warn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10px;background:#F2EBDD;color:#6B5A32;white-space:nowrap}
  .chip.student{background:#F7E4DE;color:#9A412C}
  .chip.teacher{background:#E4EEF6;color:#2B5E8C}
  .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .how-card{padding:22px 22px 20px;position:relative}
  .how-num{font-family:var(--serif);font-size:36px;color:#D8C9A8;line-height:1;position:absolute;right:20px;top:14px}
  .how-card h4{font-size:15px;margin:0 0 7px}
  .how-card p{font-size:12.5px;color:#63767E;margin:0;line-height:1.7}
  footer{border-top:1px solid #DED4C1;margin-top:40px;padding:26px 0 34px;color:#7A8B92;font-size:11px}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:44px 0 20px;border-bottom:1px solid #DED4C1;flex-wrap:wrap}
  .page-head h1{font-family:var(--serif);font-size:40px;line-height:1.1;margin:0}
  .page-head .sub{font-size:12.5px;color:#677A82;margin-top:9px}
  .selectors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .select{appearance:none;background:#FFFCF6;border:1px solid #D9CDB8;border-radius:11px;padding:10px 36px 10px 14px;font-size:13px;font-weight:600;color:#253940;min-width:220px;background-image:linear-gradient(45deg,transparent 50%,#7B8B91 50%),linear-gradient(135deg,#7B8B91 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}
  .kpi{padding:16px 18px;background:#FFFCF6;border:1px solid var(--line);border-radius:15px}
  .kpi span{font-size:10.5px;letter-spacing:.07em;color:#7A8B92;display:block}
  .kpi b{font-family:var(--serif);font-size:29px;line-height:1.15;display:block;margin-top:4px}
  .kpi small{font-size:10.5px;color:#87979D;display:block;margin-top:2px}
  .profile{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:18px}
  .profile-main{display:flex;gap:20px;align-items:center;padding:20px 22px}
  .avatar{width:62px;height:62px;border-radius:18px;background:var(--ink);color:#F2E6C8;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:700;flex:none}
  .profile-main h2{font-family:var(--serif);font-size:23px;margin:0}
  .profile-main .meta{font-size:11.5px;color:#70828A;margin-top:4px}
  .ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%), #EDE6D7 0);display:grid;place-items:center;flex:none;margin-left:auto}
  .ring i{width:70px;height:70px;border-radius:50%;background:#FFFCF6;display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:19px;font-weight:700}
  .mastery-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px;align-items:center}
  .mastery-box div{text-align:center}
  .mastery-box b{display:block;font-family:var(--serif);font-size:24px}
  .mastery-box span{font-size:10px;color:#7B8C93}
  .grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  .panel{padding:20px 22px}
  .panel h3{font-family:var(--serif);font-size:19px;margin:0 0 4px}
  .panel .ph-sub{font-size:11.5px;color:#7A8B92;margin:0 0 14px}
  .weak-card{border:1px solid var(--line2);border-radius:14px;padding:16px 17px;margin-bottom:11px;background:#FFFDF8;position:relative}
  .weak-card:last-child{margin-bottom:0}
  .wc-head{display:flex;gap:12px;align-items:flex-start}
  .rankbox{font-family:var(--serif);font-size:19px;color:#B7A785;width:28px;flex:none;line-height:1.2}
  .wc-title{font-size:14.5px;font-weight:700;line-height:1.45;margin:0}
  .wc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .badge{font-size:9.5px;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
  .badge.memory{background:var(--red-bg);color:var(--red)}
  .badge.logic{background:var(--blue-bg);color:var(--blue)}
  .badge.plain{background:#F2EBDD;color:#77633A}
  .rate{margin-left:auto;text-align:right;flex:none}
  .rate b{font-family:var(--serif);font-size:22px;line-height:1}
  .rate span{display:block;font-size:9.5px;color:#8A9AA0;margin-top:2px}
  .bar{height:7px;background:#EFE8D9;border-radius:99px;overflow:hidden;margin:11px 0 7px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#DDBB72,var(--red))}
  .wc-meta{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:#82939A;flex-wrap:wrap}
  details.advice{margin-top:9px;border-top:1px dashed #E5DCC9;padding-top:8px}
  details.advice summary{font-size:11.5px;color:#2D6AA0;cursor:pointer;list-style:none;font-weight:600}
  details.advice summary::-webkit-details-marker{display:none}
  details.advice summary::after{content:" +";font-weight:400}
  details.advice[open] summary::after{content:" −"}
  details.advice p{font-size:11.5px;color:#5E727A;line-height:1.8;margin:9px 0 0}
  .warn-side .warn-card{margin-bottom:10px}
  .warn-side .warn-parent{font-size:16.5px}
  .advice-dark{background:var(--ink);color:#fff;border-radius:16px;padding:18px 20px;margin-top:12px}
  .advice-dark h4{font-size:11px;letter-spacing:.14em;color:#E2C987;margin:0 0 8px;font-weight:600}
  .advice-dark p{font-size:12.5px;color:#D6E0E4;line-height:1.75;margin:0}
  .heat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .heat button{text-align:left;border:1px solid var(--line2);border-radius:11px;padding:10px 11px;background:#FFFDF8;transition:.16s;min-height:78px}
  .heat button:hover{border-color:#C9B88F;transform:translateY(-1px)}
  .heat .hid{font-size:9px;letter-spacing:.1em;color:#94A4AA}
  .heat .hname{font-size:11px;font-weight:600;line-height:1.45;margin:4px 0 6px;min-height:30px}
  .heat .hval{font-family:var(--serif);font-size:16px;font-weight:700}
  .heat .hbar{height:4px;background:#EFE8D9;border-radius:99px;margin-top:5px;overflow:hidden}
  .heat .hbar i{display:block;height:100%;border-radius:99px}
  .m-mastered{border-top:3px solid var(--teal)!important}
  .m-partial{border-top:3px solid var(--gold)!important}
  .m-weak{border-top:3px solid var(--red)!important}
  .no-data{border-top:3px solid #CFC6B2!important;opacity:.65}
  .seg{display:inline-flex;background:#E9E2D3;border-radius:999px;padding:4px;gap:2px}
  .seg button{padding:7px 15px;border-radius:999px;font-size:12px;color:#5E7078;transition:.15s}
  .seg button.active{background:var(--ink);color:#fff;font-weight:600}
  .data-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .data-table th{text-align:left;font-size:10px;letter-spacing:.08em;color:#7B8B91;font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .data-table td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .data-table tr:last-child td{border-bottom:0}
  .data-table tbody tr:hover{background:#FCF7EA}
  .pt-name{font-weight:600;line-height:1.45}
  .pt-id{font-size:9.5px;color:#93A3A9;letter-spacing:.08em}
  .mini-bar{height:6px;background:#EFE8D9;border-radius:99px;overflow:hidden;min-width:74px}
  .mini-bar i{display:block;height:100%;border-radius:99px}
  .tier{font-size:9.5px;padding:3px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
  .tier-focus{background:var(--red-soft);color:#9A3B26}
  .tier-mid{background:#F3EAD3;color:#836421}
  .tier-note{background:#E8EEF1;color:#4E6671}
  .chart-row{display:grid;grid-template-columns:104px 1fr 48px;gap:9px;align-items:center;margin:9px 0;font-size:11.5px}
  .chart-row .lab{color:#5D7078}
  .chart-row .val{text-align:right;font-family:var(--serif);font-weight:700;font-size:12.5px}
  .track{height:9px;background:#EFE8D9;border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A24A,#B8892E)}
  .track.red i{background:linear-gradient(90deg,#E0A08E,#C24B36)}
  .track.blue i{background:linear-gradient(90deg,#7FA9CC,#2D6AA0)}
  .compare-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 54px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
  .compare-row:last-child{border-bottom:0}
  .dual{display:flex;flex-direction:column;gap:3px}
  .dual .track{height:5px}
  .dual .track i{background:var(--blue)}
  .dual.c2 .track i{background:var(--teal)}
  .gap{font-family:var(--serif);font-weight:700;font-size:12px;text-align:right}
  .gap.warn{color:var(--red)}
  .att-level{font-size:9.5px;padding:2px 7px;border-radius:99px;font-weight:700}
  .lv-high{background:var(--red-soft);color:#8E2F1B}
  .lv-mid{background:#F3EAD3;color:#836421}
  .lv-low{background:#E8EEF1;color:#4E6671}
  .weakchips{display:flex;gap:4px;flex-wrap:wrap}
  .weakchips span{font-size:9.5px;padding:2px 6px;border-radius:6px;background:#F8EAE4;color:#8F4631;white-space:nowrap}
  .teaching-para{font-size:12.5px;line-height:1.85;color:#3D5159;background:#FBF6E9;border:1px solid #EADFC8;border-radius:14px;padding:15px 17px;white-space:pre-line}
  .teaching-para b{color:#8A6620}
  .action-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px}
  .action-list li{font-size:12px;color:#50646C;display:flex;gap:8px;line-height:1.65}
  .action-list li::before{content:"→";color:var(--gold);flex:none;font-weight:700}
  .module-cloud{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .module-cloud span{font-size:10.5px;background:#EFE8D8;color:#6C5B35;padding:4px 9px;border-radius:99px}
  .module-cloud span b{color:#3D3220;margin-left:3px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .mt16{margin-top:16px}
  .import-card{padding:20px 22px}
  .import-card summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none}
  .import-card summary::-webkit-details-marker{display:none}
  .import-card summary::before{content:"＋ ";color:var(--gold);font-weight:700}
  .import-card[open] summary::before{content:"− "}
  .import-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .file-input{font-size:11.5px;color:#5E727A}

<!-- 数据注入点：build_site.py 会把 JSON 替换到下一行的占位符（不要手改下一行） -->
<script>window.APP_DATA = __APP_DATA__;</script>
<script>
/*
  ============================================================================
  前端逻辑地图（按执行顺序）
    utils        格式化、聚合、掌握度判定
    analysis     computeModel：在浏览器里按同一口径重算（导入新数据时用）
    mind map     首页思维导图绘制
    home         首页渲染
    student      学生端渲染
    teacher      教师端渲染
    drawer       知识点详情抽屉（例题/推导/习题/证据）
    import       JSON / CSV 机器接入
    route        页面切换
  可调节的参数：
    CONFIG.mastery.*                     掌握度阈值（来自 model.json）
    CONFIG.baseline_error_rate           预警基线
    CONFIG.warning_top_n                 预警取前几个
    STATE 初始值                          默认打开哪个页面/哪个学生/哪个班
  ============================================================================
*/
(function(){
  "use strict";
  const D = window.APP_DATA;          // 由 build_site.py 注入的完整数据包
  const KP = D.points;                // 9 个知识点
  const KPMAP = Object.fromEntries(KP.map(p => [p.id, p]));
  const CONFIG = D.config;            // 分析口径，来自 engine.py 的 CONFIG
  const BASE = CONFIG.baseline_error_rate;  // 30% 预警基线
  // 初始状态：可调节默认首页、默认学生、默认班级
  const STATE = {
    view: "home",                     // home | student | teacher
    student: (D.students[0] || {}).id || "",
    teacherClass: "ALL",              // ALL 或具体班级名
    dataset: "demo"
  };
  let STUDENTS = D.students.map(s => ({...s}));
  let RAW = D.responses.map(r => ({...r}));
  let M = null;

  /* ---------- utils：格式化 / 聚合 / 掌握度判定 ---------- */
  /* 可调节：masteryOf 的阈值来自 CONFIG.mastery，改 model.json 或 engine.py 生效 */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pct = (x, d = 1) => (Number.isFinite(x) ? (x * 100).toFixed(d) : "0.0") + "%";
  const num = (x, d = 1) => Number.isFinite(x) ? x.toFixed(d) : "0.0";
  const unique = arr => Array.from(new Set(arr));
  function masteryOf(err){
    if (err <= CONFIG.mastery.mastered_max_error) return "掌握";
    if (err <= CONFIG.mastery.partial_max_error) return "部分掌握";
    return "未掌握";
  }
  function agg(rows){
    let score = 0, full = 0;
    rows.forEach(r => { score += r.sc; full += r.f; });
    const rate = full ? score / full : 0;
    return {attempts: rows.length, score, full, rate, err: full ? 1 - rate : 0};
  }
  function masteryClass(m){
    return m === "掌握" ? "m-mastered" : (m === "部分掌握" ? "m-partial" : "m-weak");
  }
  function typeBadge(t, small){
    const cls = t === "记忆型" ? "memory" : "logic";
    return `<span class="badge ${cls}">${esc(t)}</span>`;
  }
  function tierClass(t){ return t === "重点" ? "tier-focus" : (t === "次重点" ? "tier-mid" : "tier-note"); }
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("on"), 2400);
  }
  function splitLines(text, max, maxLines){
    const chars = Array.from(String(text || ""));
    const lines = [];
    let cur = "";
    for (const ch of chars){
      if (Array.from(cur).length >= max && lines.length < maxLines - 1){
        lines.push(cur); cur = "";
      }
      cur += ch;
    }
    if (cur) lines.push(cur);
    if (lines.length > maxLines){
      const out = lines.slice(0, maxLines);
      out[maxLines - 1] = out[maxLines - 1].slice(0, Math.max(1, max - 1)) + "…";
      return out;
    }
    if (lines.length === maxLines && Array.from(lines[maxLines - 1]).length > max){
      lines[maxLines - 1] = Array.from(lines[maxLines - 1]).slice(0, max - 1).join("") + "…";
    }
    return lines;
  }

  /* ---------- analysis：浏览器内重算模型（导入新数据时走这里） ---------- */
  /* computeModel 输出与 engine.py 同口径：错误率、掌握度、班级对比、预警 */
  function computeModel(students, responses){
    const byS = new Map(students.map(s => [s.id, []]));
    responses.forEach(r => { if (byS.has(r.s)) byS.get(r.s).push(r); });
    const clsOf = Object.fromEntries(students.map(s => [s.id, s.class]));
    const classes = unique(students.map(s => s.class)).sort();

    let points = KP.map(kp => {
      const rows = responses.filter(r => r.i === kp.id);
      const st = agg(rows);
      const classRates = {};
      classes.forEach(c => {
        const cr = rows.filter(r => clsOf[r.s] === c);
        if (cr.length){
          const cs = agg(cr);
          classRates[c] = {attempts: cs.attempts, score: cs.score, full: cs.full, rate: cs.rate, err: cs.err};
        }
      });
      return {...kp, ...st, mastery: masteryOf(st.err), classRates};
    });
    const ranked = points.slice().sort((a, b) => b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
    const n = ranked.length;
    const top = Math.max(1, Math.round(n * CONFIG.tiers[0].ratio));
    let mid = Math.max(1, Math.round(n * CONFIG.tiers[1].ratio));
    if (top + mid >= n) mid = Math.max(0, n - top - 1);
    ranked.forEach((p, i) => {
      p.rank = i + 1;
      p.tier = i < top ? "重点" : (i < top + mid ? "次重点" : "注意点");
    });
    points = ranked;
    const byId = Object.fromEntries(points.map(p => [p.id, p]));

    const studentRows = students.map(stu => {
      const rows = byS.get(stu.id) || [];
      const pstats = KP.map(kp => {
        const sub = rows.filter(r => r.i === kp.id);
        if (!sub.length) return null;
        const a = agg(sub);
        return {...kp, ...a, mastery: masteryOf(a.err)};
      }).filter(Boolean);
      const total = agg(rows);
      const eligible = pstats.filter(p => p.err > 0.0001 && p.attempts >= 2);
      const pool = eligible.length ? eligible : pstats.filter(p => p.err > 0.0001);
      const weakAll = pool.slice().sort((a, b) => (b.full - b.score) - (a.full - a.score) || b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
      const warnAll = pool.slice().sort((a, b) => b.err - a.err || b.attempts - a.attempts || a.id.localeCompare(b.id));
      let weak = weakAll.filter(p => p.err >= BASE).slice(0, 3);
      if (weak.length < 3){
        weak = weak.slice();
        for (const p of weakAll){ if (!weak.includes(p)) weak.push(p); if (weak.length === 3) break; }
      }
      const strong = pstats.slice().sort((a, b) => a.err - b.err || b.attempts - a.attempts || a.id.localeCompare(b.id)).slice(0, 3);
      const counts = {掌握: 0, 部分掌握: 0, 未掌握: 0};
      pstats.forEach(p => counts[p.mastery]++);
      const warnings = warnAll.slice(0, 3).map((p, i) => ({
        rank: i + 1, point_id: p.id, point_name: p.name, error_rate: p.err, attempts: p.attempts,
        parent_id: p.parent_id, parent_name: p.parent_name, parent_external: p.parent_external,
        reason: p.parent_reason,
        student_text: `「${p.parent_name}」学习仍有欠缺`,
        action: `先补「${p.parent_name}」，再回练「${p.name}」`
      }));
      return {
        ...stu, attempts: rows.length, score: total.score, full: total.full,
        rate: total.rate, err: total.err, points: pstats, weak_points: weak,
        strong_points: strong, mastery_counts: counts, warnings,
        advice_summary: weak.length
          ? `优先补「${weak.slice(0, 3).map(p => p.name).join("」「")}」。先按上面的逐条建议改错，再用同型题各练 3—5 道。`
          : "当前作答覆盖的知识点较少，建议先完成一轮完整练习后再生成个性化建议。"
      };
    });

    const byClass = {};
    classes.forEach(c => {
      const rows = studentRows.filter(s => s.class === c);
      const rates = rows.filter(s => s.attempts > 0).map(s => s.rate);
      const avg = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : 0;
      const dist = [
        {label: "不及格", range: "0—59%", count: rates.filter(r => r < 0.6).length},
        {label: "及格", range: "60—69%", count: rates.filter(r => r >= 0.6 && r < 0.7).length},
        {label: "良好", range: "70—84%", count: rates.filter(r => r >= 0.7 && r < 0.85).length},
        {label: "优秀", range: "85—100%", count: rates.filter(r => r >= 0.85).length}
      ];
      byClass[c] = {
        id: c, student_count: rows.length, avg, pass: rates.length ? rates.filter(r => r >= 0.6).length / rates.length : 0,
        excellent: rates.length ? rates.filter(r => r >= 0.85).length / rates.length : 0,
        distribution: dist,
        warnings: warningsFor(points.map(p => ({...p, err: p.classRates[c] ? p.classRates[c].err : p.err, attempts: p.classRates[c] ? p.classRates[c].attempts : 0})), 3)
      };
    });

    const sortedStudents = studentRows.slice();
    classes.forEach(c => {
      const rows = sortedStudents.filter(s => s.class === c).sort((a, b) => b.rate - a.rate || a.id.localeCompare(b.id));
      rows.forEach((s, i) => { s.class_rank = i + 1; s.class_size = rows.length; });
    });

    const warnings = warningsFor(points, CONFIG.warning_top_n);
    const teaching = teachingAdvice(studentRows, points);
    const attention = attentionList(studentRows);
    return {points, byId, classes: byClass, students: studentRows, warnings, teaching, attention, allResponses: responses};
  }

  function warningsFor(points, n){
    return points.filter(p => p.attempts > 0).slice().sort((a, b) => b.err - a.err || a.id.localeCompare(b.id)).slice(0, n).map((p, i) => ({
      rank: i + 1, point_id: p.id, point_name: p.name, error_rate: p.err, error_rate_text: pct(p.err), attempts: p.attempts,
      parent_id: p.parent_id, parent_name: p.parent_name, parent_external: p.parent_external,
      reason: p.parent_reason,
      student_text: `「${p.parent_name}」学习仍有欠缺`,
      teacher_text: `「${p.parent_name}」再讲一下吧`,
      action: `先补「${p.parent_name}」，再回练「${p.name}」`
    }));
  }

  function moduleTags(kp){
    return [
      {c: "重要性", l: kp.importance},
      ...kp.tags.map(t => ({c: "知识点类型", l: t})),
      ...kp.error_tendency.map(t => ({c: "错因倾向", l: t})),
      {c: "上级知识点追溯", l: kp.parent_id ? "有上级" : "无上级"}
    ];
  }
  function moduleText(c, l){
    const m = D.modules.find(x => x["模块类别"] === c && x["模块标签"] === l);
    return m ? m["可拼接建议话术"] : "";
  }
  function teachingAdvice(students, points){
    const counter = new Map();
    const seenStudent = new Map();
    students.forEach(s => {
      const seen = new Set();
      s.weak_points.forEach(p => {
        moduleTags(p).forEach(t => {
          const k = t.c + "|" + t.l;
          if (seen.has(k)) return;
          seen.add(k);
          counter.set(k, (counter.get(k) || 0) + 1);
        });
      });
    });
    const total = students.length || 1;
    const all = Array.from(counter.entries()).map(([k, count]) => {
      const [c, l] = k.split("|");
      return {category: c, label: l, count, share: count / total, text: moduleText(c, l)};
    }).sort((a, b) => b.count - a.count);
    const pick = (cat, n) => all.filter(x => x.category === cat).slice(0, n);
    const imp = pick("重要性", 1), types = pick("知识点类型", 1), errs = pick("错因倾向", 1);
    const focus = all.filter(x => x.category === "知识点类型" || x.category === "错因倾向").slice(0, 3);
    const topPoints = points.slice().sort((a, b) => b.err - a.err).slice(0, 3);
    const actions = [];
    if (focus.length) actions.push(`班课先按「${focus.map(x => x.label).join("」「")}」组织一轮 10 分钟微专题。`);
    actions.push(`用「${topPoints.map(p => p.name).join("」「")}」做当堂变式，先补前置节点再回练。`);
    actions.push("对重点关注对象按个人建议单独立项，三天后回收同型题正确率。");
    const ranked = ["重要性", "知识点类型", "错因倾向"].map(c => all.find(x => x.category === c)).filter(Boolean);
    const lead = ranked.length ? `全班 ${students.length} 人的建议汇总起来，「${ranked.map(x => x.label).join("」「")}」这几类最突出。` : "";
    const parts = [];
    imp.concat(types, errs).forEach(x => parts.push(x.text));
    return {
      sample_size: students.length, top_modules: all.slice(0, 12),
      paragraph: lead + "\n" + parts.join("\n"),
      actions
    };
  }
  function attentionList(students){
    const rows = students.map(s => {
      const weakAll = s.points.filter(p => p.attempts >= CONFIG.attention.min_attempts && p.err >= CONFIG.attention.weak_error_rate)
        .sort((a, b) => b.err - a.err);
      return {
        id: s.id, class: s.class, rate: s.rate, weak_count: weakAll.length,
        weak_points: weakAll.slice(0, 4).map(p => ({id: p.id, name: p.name, error_rate: p.err}))
      };
    });
    rows.sort((a, b) => b.weak_count - a.weak_count || a.rate - b.rate || a.id.localeCompare(b.id));
    rows.forEach((r, i) => {
      r.attention_rank = i + 1;
      r.level = r.weak_count >= 5 ? "高" : (r.weak_count >= 3 ? "中" : "低");
    });
    return rows;
  }

  /* ---------- mind map：首页思维导图（inline SVG，无外部依赖） ---------- */
  /* 可调节：节点坐标来自 model.json 的 mindmap，红=记忆型 蓝=逻辑型 */
  function renderMap(){
    const mm = D.mindmap;
    const nodes = mm.nodes;
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    function dims(n){ return n.kind === "point" ? {w: 210, h: 76} : {w: 150, h: 44}; }
    function anchor(a, b){
      const da = dims(a), db = dims(b);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.max(0.001, Math.hypot(dx, dy));
      const ux = dx / len, uy = dy / len;
      const t1 = Math.min((da.w / 2) / Math.max(0.001, Math.abs(ux)), (da.h / 2) / Math.max(0.001, Math.abs(uy)));
      const t2 = Math.min((db.w / 2) / Math.max(0.001, Math.abs(ux)), (db.h / 2) / Math.max(0.001, Math.abs(uy)));
      return {x1: a.x + ux * t1, y1: a.y + uy * t1, x2: b.x - ux * t2, y2: b.y - uy * t2};
    }
    const edges = mm.edges.map(e => {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) return "";
      const p = anchor(a, b);
      const mx = (p.x1 + p.x2) / 2, my = (p.y1 + p.y2) / 2;
      const vertical = Math.abs(p.x2 - p.x1) < Math.abs(p.y2 - p.y1);
      const d = vertical
        ? `M${p.x1},${p.y1} C${p.x1},${my} ${p.x2},${my} ${p.x2},${p.y2}`
        : `M${p.x1},${p.y1} C${mx},${p.y1} ${mx},${p.y2} ${p.x2},${p.y2}`;
      return `<path d="${d}" fill="none" stroke="${e.kind === "main" ? "#93A3AA" : (e.kind === "cross" ? "#C9A24A" : "#BEB4A1")}" stroke-width="${e.kind === "main" ? 1.7 : 1.3}" ${e.kind === "cross" ? 'stroke-dasharray="6 4"' : (e.kind === "foundation" ? 'stroke-dasharray="2 4"' : "")} marker-end="url(#ar-${e.kind})" opacity=".9"/>`;
    }).join("");

    const pointNodes = nodes.filter(n => n.kind === "point");
    const themeHeads = mm.themes.map(t => {
      const xs = t.points.map(id => byId[id].x);
      const x = xs.reduce((a, b) => a + b, 0) / xs.length;
      return `<g>
        <text x="${x}" y="146" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#96A5AB" font-weight="700">${esc(t.id)}</text>
        <text x="${x}" y="163" text-anchor="middle" font-size="13.5" fill="#3B4F58" font-weight="700">${esc(t.name)}</text>
        <line x1="${x - 118}" y1="172" x2="${x + 118}" y2="172" stroke="#DED4C1" stroke-width="1"/>
      </g>`;
    }).join("");

    const nodeSvg = nodes.map(n => {
      const d = dims(n);
      if (n.kind === "foundation"){
        return `<g class="node" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="前置基础 ${esc(n.name)}">
          <rect class="node-bg" x="${n.x - d.w / 2}" y="${n.y - d.h / 2}" width="${d.w}" height="${d.h}" rx="11" fill="#F4EFE3" stroke="#C6B99F" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="12" fill="#6D6047" font-weight="600">${esc(n.name)}</text>
          <title>${esc(n.name)}：${esc(n.detail || "")}</title>
        </g>`;
      }
      const color = n.type === "记忆型" ? "#C24B36" : "#2D6AA0";
      const bg = n.type === "记忆型" ? "#FBEAE5" : "#E9F1FA";
      const lines = splitLines(n.name, 12, 2);
      const lineSvg = lines.length === 1
        ? `<text x="${n.x - 94}" y="${n.y + 4}" font-size="14.5" fill="#1B2C34" font-weight="700">${esc(lines[0])}</text>`
        : `<text x="${n.x - 94}" y="${n.y - 2}" font-size="14" fill="#1B2C34" font-weight="700">${esc(lines[0])}</text><text x="${n.x - 94}" y="${n.y + 17}" font-size="14" fill="#1B2C34" font-weight="700">${esc(lines[1])}</text>`;
      return `<g class="node" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}，错误率 ${esc(n.error_rate_text)}">
        <rect class="node-bg" x="${n.x - d.w / 2}" y="${n.y - d.h / 2}" width="${d.w}" height="${d.h}" rx="14" fill="${bg}" stroke="${color}" stroke-width="1.2"/>
        <path d="M${n.x - d.w / 2 + 7},${n.y - d.h / 2} h-1 a6,6 0 0 0 -6,6 v${d.h - 12} a6,6 0 0 0 6,6 h1 z" fill="${color}"/>
        <rect x="${n.x - d.w / 2 + 2}" y="${n.y - d.h / 2 + 10}" width="6" height="${d.h - 20}" rx="3" fill="${color}"/>
        <text x="${n.x - 94}" y="${n.y - 23}" font-size="9.5" letter-spacing="1" fill="#7E9098" font-weight="600">${esc(n.id)} · ${esc(n.type)}</text>
        <rect x="${n.x + 36}" y="${n.y - 32}" width="66" height="18" rx="9" fill="#FFFFFF" opacity=".78"/>
        <text x="${n.x + 69}" y="${n.y - 19}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${esc(n.error_rate_text)}</text>
        ${lineSvg}
        <text x="${n.x - 94}" y="${n.y + 34}" font-size="9.5" fill="#7E9098">${esc(n.importance)} · ${esc(n.tier)}</text>
      </g>`;
    }).join("");

    return `<svg class="map" id="map-svg" viewBox="0 0 ${mm.canvas.width} ${mm.canvas.height}" role="img" aria-label="知识点思维导图">
      <defs>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#20313A" flood-opacity=".08"/></filter>
        <marker id="ar-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#93A3AA"/></marker>
        <marker id="ar-cross" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C9A24A"/></marker>
        <marker id="ar-foundation" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#BEB4A1"/></marker>
      </defs>
      ${themeHeads}
      ${edges}
      ${nodeSvg}
    </svg>`;
  }

  /* ---------- teacher：教师端（重点汇总 / 成绩分析 / 两班对比 / 重点关注） ---------- */
  function renderTeacher(){
    const cls = STATE.teacherClass;
    const all = cls === "ALL";
    const students = all ? M.students : M.students.filter(s => s.class === cls);
    const points = M.points.map(p => all ? p : {
      ...p,
      err: p.classRates[cls] ? p.classRates[cls].err : p.err,
      rate: p.classRates[cls] ? p.classRates[cls].rate : p.rate,
      attempts: p.classRates[cls] ? p.classRates[cls].attempts : 0
    });
    const classInfo = all ? null : M.classes[cls];
    const avg = all ? students.reduce((a, s) => a + s.rate, 0) / Math.max(1, students.length) : classInfo.avg;
    const pass = all ? students.filter(s => s.rate >= 0.6).length / Math.max(1, students.length) : classInfo.pass;
    const excellent = all ? students.filter(s => s.rate >= 0.85).length / Math.max(1, students.length) : classInfo.excellent;
    const warnings = all ? M.warnings : warningsFor(points, 3);
    const teaching = all ? M.teaching : teachingAdvice(students, points);
    const attention = all ? M.attention : attentionList(students);
    const attentionHigh = attention.filter(a => a.level === "高").length;
    const dist = all ? [
      {label: "不及格", range: "0—59%", count: students.filter(s => s.rate < 0.6).length},
      {label: "及格", range: "60—69%", count: students.filter(s => s.rate >= 0.6 && s.rate < 0.7).length},
      {label: "良好", range: "70—84%", count: students.filter(s => s.rate >= 0.7 && s.rate < 0.85).length},
      {label: "优秀", range: "85—100%", count: students.filter(s => s.rate >= 0.85).length}
    ] : classInfo.distribution;
    const maxDist = Math.max(1, ...dist.map(d => d.count));
    const themes = D.mindmap.themes.map(t => {
      const pts = t.points.map(id => points.find(p => p.id === id)).filter(Boolean);
      const score = pts.reduce((a, p) => a + (p.classRates && !all && p.classRates[cls] ? p.classRates[cls].score : p.score), 0);
      const full = pts.reduce((a, p) => a + (p.classRates && !all && p.classRates[cls] ? p.classRates[cls].full : p.full), 0);
      return {...t, err: full ? 1 - score / full : 0};
    });
    const cids = Object.keys(M.classes);
    const focusCount = points.filter(p => p.tier === "重点").length;
    const midCount = points.filter(p => p.tier === "次重点").length;
    const noteCount = points.filter(p => p.tier === "注意点").length;

    return `
    <section class="wrap">
      <div class="page-head">

        <div class="kpi"><span>优秀率</span><b>${pct(excellent)}</b><small>得分率 ≥ 85%</small></div>
        <div class="kpi"><span>重点关注对象</span><b>${attentionHigh}<small style="font-size:12px"> 人</small></b><small>薄弱点 ≥ 5 个</small></div>
      </div>

      <section class="card panel">

        <p class="ph-sub">按错误率从高到低排：最高的三成是重点（${focusCount} 个），中间四成是次重点（${midCount} 个），剩下三成算注意点（${noteCount} 个）。${all ? "" : `当前显示 ${esc(cls)} 的错误率；分层仍按全年级口径。`}</p>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>#</th><th>知识点</th><th>类型</th><th>错误率${all ? "" : "（" + esc(cls) + "）"}</th><th>层级</th><th>${cids.map(c => esc(c)).join(" / ")}</th><th>前置节点</th></tr></thead>
            <tbody>${points.map(p => `
              <tr>
                <td style="font-family:var(--serif);color:#A99772">${String(p.rank).padStart(2, "0")}</td>
                <td><div class="pt-name">${esc(p.name)}</div><div class="pt-id">${esc(p.id)} · ${esc(p.importance)}</div></td>
                <td>${typeBadge(p.primary_type)}</td>
                <td><div style="display:flex;align-items:center;gap:8px"><div class="mini-bar" style="flex:1"><i style="width:${Math.max(3, p.err * 100)}%;background:${p.err >= 0.45 ? "var(--red)" : (p.err >= BASE ? "var(--gold)" : "var(--teal)")}"></i></div><b style="font-family:var(--serif);font-size:12px">${pct(p.err)}</b></div></td>
                <td><span class="tier ${tierClass(p.tier)}">${esc(p.tier)}</span></td>
                <td style="font-size:11px;color:#5D7078">${cids.map(c => `<span style="display:inline-block;min-width:52px">${p.classRates[c] ? pct(p.classRates[c].err, 0) : "—"}</span>`).join("")}</td>

              </tr>`).join("")}</tbody>

      </section>

      <div class="two-col mt16">
        <section class="card panel">

          ${dist.map(d => `<div class="chart-row"><span class="lab">${esc(d.label)} <span style="color:#9AA9AF">${esc(d.range)}</span></span><div class="track"><i style="width:${(d.count / maxDist) * 100}%"></i></div><span class="val">${d.count} 人</span></div>`).join("")}

          ${themes.map(t => `<div class="chart-row"><span class="lab">${esc(t.id)} ${esc(t.name)}</span><div class="track ${t.err >= 0.45 ? "red" : ""}"><i style="width:${Math.max(3, (1 - t.err) * 100)}%"></i></div><span class="val">${pct(1 - t.err)}</span></div>`).join("")}

            <article class="warn-card" style="margin-bottom:10px">

          CSV 列名：<span class="code">student,indicator,score,full</span>，UTF-8 编码。未知知识点、满分 ≤ 0、得分越界的记录会被自动过滤，并在下方提示。

  }

  /* ---------- drawer：知识点详情抽屉（例题 / 推导 / 课后习题 / 教材证据） ---------- */
  function openPoint(pid){
    const c = D.content[pid];
    const p = M.byId[pid];
    if (!c || !p) return;
    const sp = (M.students.find(s => s.id === STATE.student) || {}).points?.find(x => x.id === pid);
    const drawer = $("#drawer");
    const overall = p;
    const classRates = Object.entries(overall.classRates || {}).map(([k, v]) => `<span class="stat-mini" style="display:block"><span>${esc(k)}</span><b>${pct(v.err)}</b></span>`).join("");
    drawer.innerHTML = `
      <div class="drawer-head">
        <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
        <div class="did">${esc(p.id)} · ${esc(p.theme)} · ${esc(p.pages)}</div>
        <h2>${esc(p.name)}</h2>
        <div class="drawer-meta"><span>${esc(p.tags.join(" / "))}</span><span>${esc(p.importance)}</span><span>全班错误率 ${pct(p.err)}</span>${sp ? `<span>我的错误率 ${pct(sp.err)}</span>` : ""}</div>
      </div>
      <div class="tabs" role="tablist">
        <button data-tab="example" class="active">教材例题</button>
        <button data-tab="derive">推导过程</button>
        <button data-tab="exercise">课后习题</button>
        <button data-tab="data">学情数据</button>
        <button data-tab="advice">学习建议</button>
      </div>
      <div class="drawer-body">
        <section class="tabpane active" data-pane="example">
          <div class="prompt">${esc(c.example.prompt)}</div>
          <div style="margin-top:14px">${c.example.steps.map(s => `<div class="stepline"><b>${esc(s.label)}</b><div>${esc(s.content)}</div></div>`).join("")}</div>
          <div class="answerbox">${esc(c.example.answer)}</div>
          <div class="note">${esc(c.example.note)}</div>
          <div class="note" style="color:#9AA9AF">对应教材：${esc(c.example.pages)}</div>
        </section>

        <section class="tabpane" data-pane="derive">
          <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 10px">${esc(c.derivation.title)}</h3>
          <div>${c.derivation.steps.map(s => `<div class="stepline"><b>${esc(s.label)}</b><div>${esc(s.content)}</div></div>`).join("")}</div>
          <div class="conclusion">${esc(c.derivation.conclusion)}</div>
        </section>

        <section class="tabpane" data-pane="exercise">
          <p class="ph-sub" style="font-size:11.5px;color:#7A8B92;margin:0 0 12px">${esc(c.exercise_note)} · 共 ${c.exercises.length} 题</p>
          ${c.exercises.map(q => `<article class="ex-card">
            <div class="ex-top"><span class="eid">${esc(q.id)}</span><span class="badge plain">${esc(q.type)}</span><span class="badge ${q.level === "基础" ? "logic" : "memory"}">${esc(q.level)}</span><span style="margin-left:auto;font-size:9.5px;color:#9AA9AF">${q.full} 分</span></div>
            <p class="ex-stem">${esc(q.stem)}</p>
            <details><summary>查看答案与解析</summary><div class="ex-answer"><b>答案：</b>${esc(q.answer)}<br><b>解析：</b>${esc(q.explanation)}</div></details>
          </article>`).join("")}
        </section>

        <section class="tabpane" data-pane="data">
          <div class="stat-split">
            <div class="stat-mini"><span>全班错误率</span><b style="color:${overall.err >= 0.45 ? "var(--red)" : "var(--gold)"}">${pct(overall.err)}</b></div>
            <div class="stat-mini"><span>分层</span><b>${esc(overall.tier)}</b></div>
            <div class="stat-mini"><span>作答人次</span><b>${overall.attempts}</b></div>
            <div class="stat-mini"><span>掌握判定</span><b>${esc(overall.mastery)}</b></div>
          </div>
          ${sp ? `<div class="prompt" style="font-size:12px">我的作答：${sp.attempts} 次，得分 ${num(sp.score)} / ${num(sp.full)}，错误率 ${pct(sp.err)}，判定为「${esc(sp.mastery)}」。</div>` : `<div class="note">当前学生尚未作答该知识点。</div>`}
          <h4 style="font-size:12px;margin:16px 0 6px">两班错误率</h4>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${classRates || "<div class='note'>暂无分班数据</div>"}</div>
          <h4 style="font-size:12px;margin:16px 0 6px">前置关系</h4>
          <div class="note">直接前置节点：<b>${esc(p.parent_name)}</b>${p.parent_external ? "（思维导图外的基础节点）" : "（导图内节点）"}。${esc(p.parent_reason)}</div>
          <div class="note">教材原文依据：</div>
          ${c.evidence.map(e => `<div class="err-card" style="border-left-color:var(--gold);background:#FBF6E9"><b>${esc(e.title)}</b> <span style="color:#9AA9AF">${esc(e.chapter)} · 第 ${e.page} 页</span><span>${esc(e.quote)}</span></div>`).join("")}
        </section>

        <section class="tabpane" data-pane="advice">
          <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 8px">这条知识点的学习建议</h3>
          <div class="teaching-para">${esc(p.advice)}</div>
          <h4 style="font-size:13px;margin:18px 0 6px">常见错误</h4>
          ${c.common_errors.map(e => `<div class="err-card"><b>${esc(e.error)}</b><span>${esc(e.fix)}</span></div>`).join("")}
          <h4 style="font-size:13px;margin:18px 0 6px">提分小提示</h4>

      </div>`;
    drawer.classList.add("on");
    drawer.setAttribute("aria-hidden", "false");
    $("#drawer-overlay").classList.add("on");
    document.body.style.overflow = "hidden";
    $("#drawerClose").onclick = closeDrawer;
    $$(".tabs button", drawer).forEach(btn => btn.onclick = () => {
      $$(".tabs button", drawer).forEach(b => b.classList.remove("active"));
      $$(".tabpane", drawer).forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      const pane = $(`.tabpane[data-pane="${btn.dataset.tab}"]`, drawer);
      if (pane) pane.classList.add("active");
    });
    drawer.scrollTop = 0;
  }
  function closeDrawer(){
    $("#drawer").classList.remove("on");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#drawer-overlay").classList.remove("on");
    document.body.style.overflow = "";
  }

  /* ---------- bindings ---------- */
  function bindHome(){
    $$("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
    const svg = $("#map-svg");
    if (svg){
      const activate = id => {
        if (KPMAP[id]) openPoint(id);
        else {
          const n = D.mindmap.nodes.find(x => x.id === id);
          if (n) toast(`前置基础：${n.name} · ${n.detail || ""}`);
        }
      };
      svg.addEventListener("click", e => {
        const g = e.target.closest("[data-node]");
        if (g) activate(g.dataset.node);
      });
      svg.addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const g = e.target.closest("[data-node]");
        if (g){ e.preventDefault(); activate(g.dataset.node); }
      });
      $$(".theme-card").forEach(card => card.onclick = () => { $("#map-section").scrollIntoView({behavior:"smooth", block:"start"}); });
    }
  }
  function bindStudent(){
    const sel = $("#studentSel");
    if (sel) sel.onchange = () => { STATE.student = sel.value; render(); };
    $$("[data-point]").forEach(b => b.onclick = () => openPoint(b.dataset.point));
  }
  function bindTeacher(){
    $$("#classSeg button").forEach(b => b.onclick = () => { STATE.teacherClass = b.dataset.class; render(); });
    $$("tbody tr").forEach(() => {});
    const file = $("#importFile");
    if (file) file.onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const result = f.name.toLowerCase().endsWith(".csv") ? parseCSV(text) : parseJSON(text);
          applyImport(result.students, result.responses, result.note);
        } catch (err) {
          toast("导入失败：" + err.message);
        }
      };
      reader.readAsText(f, "utf-8");
    };
    const sample = $("#loadSample");
    if (sample) sample.onclick = loadSampleData;
    const reset = $("#resetData");
    if (reset) reset.onclick = () => {
      STUDENTS = D.students.map(s => ({...s}));
      RAW = D.responses.map(r => ({...r}));
      STATE.dataset = "demo";
      M = computeModel(STUDENTS, RAW);
      STATE.student = M.students[0].id;
      const st = $("#importStatus");
      if (st) st.textContent = "已恢复演示数据";
      render();
      toast("已恢复 40 名学生、813 条作答的演示数据");
    };
    // 点击表格行打开学生
    $$("tbody tr[data-student]").forEach(tr => tr.onclick = () => {
      STATE.student = tr.dataset.student;
      location.hash = "student";
    });
  }
  function render(){
    const view = $("#view");
    if (STATE.view === "home") view.innerHTML = renderHome();
    else if (STATE.view === "student") view.innerHTML = renderStudent();
    else view.innerHTML = renderTeacher();
    $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === STATE.view));
    if (STATE.view === "home") bindHome();
    else if (STATE.view === "student") bindStudent();
    else bindTeacher();
  }

  /* ---------- import：机器接入（粘贴 JSON / 上传 CSV 后重算） ---------- */
  function normResp(r){
    const s = r.student ?? r.student_id ?? r.s ?? r.uid;
    const i = r.indicator ?? r.point ?? r.i ?? r.knowledge_id;
    const sc = Number(r.score ?? r.sc ?? r.points);
    const f = Number(r.full ?? r.f ?? r.max_score ?? r.full_score);
    if (!s || !i || !Number.isFinite(sc) || !Number.isFinite(f) || f <= 0 || sc < 0 || sc > f) return null;
    if (!KPMAP[i]) return null;
    return {s: String(s), i: String(i), sc, f};
  }
  function parseJSON(text){
    const obj = JSON.parse(text);
    const arr = Array.isArray(obj) ? obj : (obj.responses || obj.records || obj.data || []);
    const responses = arr.map(normResp).filter(Boolean);
    let students = Array.isArray(obj.students) ? obj.students.map(x => ({id: String(x.id ?? x.student ?? x.student_id), class: String(x.class ?? x.class_id ?? "导入数据"), grade: x.grade ?? 7})).filter(x => x.id) : [];
    if (!students.length){
      const ids = unique(responses.map(r => r.s));
      students = ids.map(id => {
        const old = STUDENTS.find(s => s.id === id);
        return {id, class: old ? old.class : "导入数据", grade: 7};
      });
    }
    const ids = new Set(students.map(s => s.id));
    responses.forEach(r => { if (!ids.has(r.s)){ students.push({id: r.s, class: "导入数据", grade: 7}); ids.add(r.s); } });
    return {students, responses, note: `JSON：${responses.length} 条有效作答，${students.length} 名学生`};
  }
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error("CSV 没有数据行");
    const head = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
    const idx = name => head.indexOf(name);
    const is = idx("student"), ii = idx("indicator"), isc = idx("score"), ifull = idx("full");
    if ([is, ii, isc, ifull].some(x => x < 0)) throw new Error("CSV 需要列 student,indicator,score,full");
    const responses = [];
    for (let k = 1; k < lines.length; k++){
      const cols = lines[k].split(",").map(c => c.trim().replace(/^"|"$/g, ""));
      const r = normResp({student: cols[is], indicator: cols[ii], score: cols[isc], full: cols[ifull]});
      if (r) responses.push(r);
    }
    const ids = unique(responses.map(r => r.s));
    const students = ids.map(id => {
      const old = STUDENTS.find(s => s.id === id);
      return {id, class: old ? old.class : "导入数据", grade: 7};
    });
    return {students, responses, note: `CSV：${responses.length} 条有效作答，${students.length} 名学生`};
  }
  function loadSampleData(){
    const responses = (D.sample.responses || []).map(normResp).filter(Boolean);
    const students = (D.sample.students || []).map(x => ({id: String(x.id), class: String(x.class || "示例班"), grade: x.grade || 7}));
    applyImport(students, responses, `示例数据：${responses.length} 条作答，${students.length} 名学生`);
  }
  function applyImport(students, responses, note){
    if (!students.length || !responses.length) throw new Error("没有有效记录");
    STUDENTS = students;
    RAW = responses;
    STATE.dataset = "imported";
    M = computeModel(STUDENTS, RAW);
    STATE.student = M.students[0].id;
    STATE.teacherClass = "ALL";
    const status = $("#importStatus");
    render();
    const st = $("#importStatus");
    if (st) st.textContent = note + "；已用同一模型重算";
    toast(note);
  }

  /* ---------- route：页面切换与初始化 ---------- */
  function route(){
    const v = (location.hash || "#home").slice(1);
    if (v.startsWith("point=")){
      STATE.view = "home";
      render();
      openPoint(v.slice(6));
      return;
    }
    const parts = v.split("/");
    if (parts[0] === "teacher" && parts[1] === "sample"){
      STATE.view = "teacher";
      render();
      loadSampleData();
      return;
    }
    if (parts[0] === "student" && parts[1] && M.students.some(s => s.id === parts[1])) STATE.student = parts[1];
    if (parts[0] === "teacher" && parts[1] && (parts[1] === "ALL" || M.classes[parts[1]])) STATE.teacherClass = parts[1];
    STATE.view = ["home","student","teacher"].includes(parts[0]) ? parts[0] : "home";
    render();
    window.scrollTo({top:0, behavior:"auto"});
  }
  $("#nav").addEventListener("click", e => {
    const b = e.target.closest("[data-view]");
    if (b) location.hash = b.dataset.view;
  });
  $("#drawer-overlay").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
  window.addEventListener("hashchange", route);

  M = computeModel(STUDENTS, RAW);
  if (!STATE.student && M.students.length) STATE.student = M.students[0].id;
  route();
})();
</script>
